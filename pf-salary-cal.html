<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Calculator</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:30px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#333;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.result{
    margin-top:25px;
    background:#eef7ff;
    padding:15px;
    border-radius:8px;
}

.result p{
    font-size:18px;
    margin:8px 0;
}
</style>
</head>
<body>

<div class="container">

<h2>Salary Calculator</h2>

<label>Hourly Rate (₹)</label>
<input type="number" id="rate" value="63.11" readonly>

<label>Working Hours Per Day</label>
<input type="number" id="hours" value="8" readonly>

<label>Number of Working Days</label>
<input type="number" id="days" value="26">

<label>Professional Tax (₹)</label>
<input type="number" id="pt" value="200">

<label>ESIC (₹)</label>
<input type="number" id="esic" value="109">

<label>PF Deduction (₹)</label>
<input type="number" id="pf" value="0">

<label>Other Deduction (₹)</label>
<input type="number" id="other" value="0">

<button onclick="calculateSalary()">Calculate Salary</button>

<div class="result">
    <p><strong>Gross Salary:</strong> ₹ <span id="gross">0.00</span></p>
    <p><strong>Total Deductions:</strong> ₹ <span id="deduction">0.00</span></p>
    <p><strong>Net Salary:</strong> ₹ <span id="net">0.00</span></p>
</div>

</div>

<script>
function calculateSalary(){

    let rate = parseFloat(document.getElementById("rate").value);
    let hours = parseFloat(document.getElementById("hours").value);
    let days = parseFloat(document.getElementById("days").value);

    let pt = parseFloat(document.getElementById("pt").value) || 0;
    let esic = parseFloat(document.getElementById("esic").value) || 0;
    let pf = parseFloat(document.getElementById("pf").value) || 0;
    let other = parseFloat(document.getElementById("other").value) || 0;

    let gross = rate * hours * days;

    let totalDeduction = pt + esic + pf + other;

    let net = gross - totalDeduction;

    document.getElementById("gross").innerHTML = gross.toFixed(2);
    document.getElementById("deduction").innerHTML = totalDeduction.toFixed(2);
    document.getElementById("net").innerHTML = net.toFixed(2);
}

// Calculate on page load
calculateSalary();
</script>

</body>
</html>
