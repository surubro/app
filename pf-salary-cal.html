<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Calculator</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:30px;
}
.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}
h2{
    text-align:center;
    color:#333;
}
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    box-sizing:border-box;
}
.result{
    margin-top:25px;
    background:#f8f8f8;
    padding:15px;
    border-radius:8px;
}
.result p{
    font-size:18px;
    margin:10px 0;
}
.total{
    font-size:22px;
    color:green;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h2>Salary Calculator</h2>

<label>Hourly Rate (₹)</label>
<input type="number" id="rate" value="60">

<label>Hours Per Day</label>
<input type="number" id="hours" value="8">

<label>Number of Days Worked</label>
<input type="number" id="days" value="26">

<label>Other Deduction (₹)</label>
<input type="number" id="other" value="0">

<div class="result">

<p>Gross Salary: ₹ <span id="gross">0.00</span></p>

<p>PF (12%): ₹ <span id="pf">0.00</span></p>

<p>Professional Tax: ₹ <span id="tax">200.00</span></p>

<p>ESIC: ₹ <span id="esic">109.00</span></p>

<p>Other Deduction: ₹ <span id="otherDeduction">0.00</span></p>

<hr>

<p>Total Deduction: ₹ <span id="totalDeduction">0.00</span></p>

<p class="total">Net Salary: ₹ <span id="netSalary">0.00</span></p>

</div>

</div>

<script>

function calculate(){

    let rate = parseFloat(document.getElementById("rate").value) || 0;
    let hours = parseFloat(document.getElementById("hours").value) || 0;
    let days = parseFloat(document.getElementById("days").value) || 0;
    let other = parseFloat(document.getElementById("other").value) || 0;

    let gross = rate * hours * days;

    let pf = gross * 0.12;
    let tax = 200;
    let esic = 109;

    let totalDeduction = pf + tax + esic + other;

    let netSalary = gross - totalDeduction;

    document.getElementById("gross").innerHTML = gross.toFixed(2);
    document.getElementById("pf").innerHTML = pf.toFixed(2);
    document.getElementById("tax").innerHTML = tax.toFixed(2);
    document.getElementById("esic").innerHTML = esic.toFixed(2);
    document.getElementById("otherDeduction").innerHTML = other.toFixed(2);
    document.getElementById("totalDeduction").innerHTML = totalDeduction.toFixed(2);
    document.getElementById("netSalary").innerHTML = netSalary.toFixed(2);

}

document.querySelectorAll("input").forEach(input=>{
    input.addEventListener("input",calculate);
});

calculate();

</script>

</body>
</html>
