<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Calculator</title>
<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:20px auto;
    padding:20px;
}
h1{
    text-align:center;
}
.card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:20px;
    margin-bottom:20px;
}
input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    cursor:pointer;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    border:1px solid #ddd;
    padding:10px;
}
th{
    background:#f5f5f5;
}
.deduction-row{
    display:flex;
    align-items:center;
    margin-bottom:8px;
    gap:10px;
}
.deduction-row input{
    flex:1;
}
.deduction-row button{
    width:auto;
    padding:8px 16px;
}
#deductions{
    margin-bottom:20px;
}
</style>
</head>
<body>
<h1>Salary Calculator</h1>
<div class="card">
<label>Days Worked</label> <input type="number" id="days" value="30" min="0">
<label>Hours Per Day</label> <input type="number" id="hours" value="8" min="1">
<button onclick="calculate()">Calculate Salary</button>
</div>

<div class="card">
<h3>Deductions</h3>
<div id="deductions"></div>
<button onclick="addDeduction()">+ Add Deduction</button>
</div>

<div class="card">
<table>
<tr>
<th>Item</th>
<th>Value</th>
</tr>
<tr>
<td>Days Worked</td>
<td id="daysWorked">0</td>
</tr>
<tr>
<td>Total Hours</td>
<td id="totalHours">0</td>
</tr>
<tr>
<td>Gross Salary</td>
<td id="grossSalary">₹0</td>
</tr>
<tr>
<td>Employee PF</td>
<td id="employeePF">₹0</td>
</tr>
<tr>
<td>Employer PF</td>
<td id="employerPF">₹0</td>
</tr>
<tr>
<td>Employer ESIC</td>
<td id="employerESIC">₹0</td>
</tr>
<tr>
<td>Gratuity</td>
<td id="gratuity">₹0</td>
</tr>
<tr>
<td><b>Total PF (Employee + Employer)</b></td>
<td id="totalPF"><b>₹0</b></td>
</tr>
<tr>
<td><b>Estimated Net Salary</b></td>
<td id="netSalary"><b>₹0</b></td>
</tr>
<tr>
<td><b>Total Deductions</b></td>
<td id="totalDeductions"><b>₹0</b></td>
</tr>
<tr>
<td><b>Final Take-Home Salary</b></td>
<td id="takeHomeSalary"><b>₹0</b></td>
</tr>
</table>
</div>

<script>
const BASIC_PER_HOUR = 41.04;
const GROSS_PER_HOUR = 63.11;
const EMPLOYER_PF_PER_HOUR = 6.31;
const EMPLOYER_ESIC_PER_HOUR = 2.05;
const GRATUITY_PER_HOUR = 2.53;

let deductions = [];

function addDeduction() {
    const container = document.getElementById('deductions');
    const rowId = 'ded-row-' + Date.now();
    
    const div = document.createElement('div');
    div.className = 'deduction-row';
    div.id = rowId;
    div.innerHTML = `
        <input type="number" class="ded-amount" placeholder="Deduction Amount" value="0" min="0">
        <input type="text" class="ded-name" placeholder="Name of Deduction" value="Other Deduction">
        <button onclick="removeDeduction('${rowId}')">Remove</button>
    `;
    container.appendChild(div);
}

function removeDeduction(rowId) {
    const row = document.getElementById(rowId);
    if (row) row.remove();
}

function calculate() {
    const days = Number(document.getElementById("days").value);
    const hoursPerDay = Number(document.getElementById("hours").value);
    const totalHours = days * hoursPerDay;

    const grossSalary = totalHours * GROSS_PER_HOUR;
    const employeePF = totalHours * BASIC_PER_HOUR * 0.12;
    const employerPF = totalHours * EMPLOYER_PF_PER_HOUR;
    const employerESIC = totalHours * EMPLOYER_ESIC_PER_HOUR;
    const gratuity = totalHours * GRATUITY_PER_HOUR;
    const totalPF = employeePF + employerPF;
    const netSalary = grossSalary - employeePF;

    // Get all deductions
    const deductionRows = document.querySelectorAll('.deduction-row');
    let totalDeductions = 0;
    deductionRows.forEach(row => {
        const amount = parseFloat(row.querySelector('.ded-amount').value) || 0;
        totalDeductions += amount;
    });

    const takeHomeSalary = grossSalary - employeePF - totalDeductions;

    // Update table
    document.getElementById("daysWorked").textContent = days;
    document.getElementById("totalHours").textContent = totalHours.toFixed(2);
    document.getElementById("grossSalary").textContent = "₹" + grossSalary.toFixed(2);
    document.getElementById("employeePF").textContent = "₹" + employeePF.toFixed(2);
    document.getElementById("employerPF").textContent = "₹" + employerPF.toFixed(2);
    document.getElementById("employerESIC").textContent = "₹" + employerESIC.toFixed(2);
    document.getElementById("gratuity").textContent = "₹" + gratuity.toFixed(2);
    document.getElementById("totalPF").textContent = "₹" + totalPF.toFixed(2);
    document.getElementById("netSalary").textContent = "₹" + netSalary.toFixed(2);
    document.getElementById("totalDeductions").textContent = "₹" + totalDeductions.toFixed(2);
    document.getElementById("takeHomeSalary").textContent = "₹" + takeHomeSalary.toFixed(2);
}

addDeduction();
calculate();
</script>
</body>
</html>
