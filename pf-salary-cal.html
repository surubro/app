<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Calculator</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.container{
    width:420px;
    margin:30px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:8px;
    font-size:16px;
    margin-top:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    font-size:16px;
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#0056b3;
}

.result{
    margin-top:20px;
    background:#eef7ff;
    padding:15px;
    border-radius:8px;
}

.result p{
    margin:8px 0;
    font-size:17px;
}
</style>

</head>
<body>

<div class="container">

<h2>Salary Calculator</h2>

<label>No. of Days Worked</label>
<input type="number" id="days" placeholder="Enter days">

<label>PF Deduction (Optional)</label>
<input type="number" id="pf" value="0">

<label>Other Deduction</label>
<input type="number" id="other" value="0">

<button onclick="calculateSalary()">Calculate Salary</button>

<div class="result">

<p>Total Hours : <span id="hours">0</span></p>

<p>Gross Salary : ₹<span id="gross">0.00</span></p>

<p>Professional Tax : ₹200</p>

<p>ESIC : ₹109</p>

<p>PF : ₹<span id="pfshow">0</span></p>

<p>Other Deduction : ₹<span id="othershow">0</span></p>

<hr>

<p><b>Total Deduction : ₹<span id="deduction">0.00</span></b></p>

<p style="font-size:20px;color:green;">
<b>Net Salary : ₹<span id="net">0.00</span></b>
</p>

</div>

</div>

<script>

const hourlyRate = 63.11;
const hoursPerDay = 8;
const professionalTax = 200;
const esic = 109;

function calculateSalary(){

let days = Number(document.getElementById("days").value);
let pf = Number(document.getElementById("pf").value);
let other = Number(document.getElementById("other").value);

let hours = days * hoursPerDay;

let gross = hours * hourlyRate;

let totalDeduction = professionalTax + esic + pf + other;

let net = gross - totalDeduction;

document.getElementById("hours").innerHTML = hours;

document.getElementById("gross").innerHTML =
gross.toFixed(2);

document.getElementById("pfshow").innerHTML =
pf.toFixed(2);

document.getElementById("othershow").innerHTML =
other.toFixed(2);

document.getElementById("deduction").innerHTML =
totalDeduction.toFixed(2);

document.getElementById("net").innerHTML =
net.toFixed(2);

}

</script>

</body>
</html>
