<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phone SMS · Copy en</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, virtual-keyboard=interactive-widget" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f0f2f5; /* match chat bg so no white flash */
    }
    body { display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* Boot loader — shown until auth state is known */
    #bootScreen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      color: #64748b;
      font-size: 14px;
    }

    /* ---------- LOGIN ---------- */
    #loginScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f0f2f5; /* match chat bg — no flash */
      text-align: center;
      padding: 20px;
    }
    #loginScreen h2 { margin-bottom: 24px; color: #1e293b; font-weight: 500; }
    #loginScreen input {
      padding: 12px 16px;
      font-size: 16px;
      margin: 8px 0;
      border-radius: 12px;
      border: 1px solid #d1d9e6;
      width: 280px;
      max-width: 90%;
      outline: none;
      background: #ffffff;
      transition: border .2s, box-shadow .2s;
    }
    #loginScreen input:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,.15);
    }
    #loginScreen button {
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 500;
      background: #007bff;
      border: none;
      color: #fff;
      border-radius: 40px;
      cursor: pointer;
      margin-top: 16px;
      width: 280px;
      max-width: 90%;
    }
    #loginScreen button:hover { background: #0069d9; }

    /* ---------- CHAT ---------- */
    #chatUI {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      background: #f0f2f5;
    }
    @media (min-width: 768px) {
      #chatUI {
        max-width: 600px;
        margin: 0 auto;
        border-left: 1px solid #d0d7dd;
        border-right: 1px solid #d0d7dd;
        background: #f8fafc;
      }
    }
    .chat-box {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 16px 14px 12px;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .message {
      padding: 10px 16px;
      margin: 4px 0;
      border-radius: 20px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 15px;
      line-height: 1.4;
      cursor: text;
      user-select: text;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .sent {
      align-self: flex-end;
      background: #dcf8c6;
      color: #1e2b1a;
      border-bottom-right-radius: 6px;
    }
    .received {
      align-self: flex-start;
      background: #ffffff;
      color: #1e2b1a;
      border-bottom-left-radius: 6px;
      border: 1px solid #e2e8f0;
    }

    /* ---------- INPUT ---------- */
    .input-container {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: #fff;
      border-top: 1px solid #dce1e6;
      flex-shrink: 0;
      gap: 6px;
    }
    .input-container textarea {
      flex: 1;
      resize: none;
      padding: 12px 18px;
      font-size: 16px;
      border: 1px solid #d0d9e2;
      border-radius: 30px;
      outline: none;
      height: 48px;
      background: #f8fafc;
      font-family: inherit;
    }
    .input-container textarea:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,.1);
      background: #fff;
    }
    .btn-icon {
      background: #007bff;
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    #logoutBtn {
      background: #6c757d;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      flex-shrink: 0;
      height: 44px;
    }
  </style>
</head>
<body>

  <!-- 1) Boot screen shown while we check auth (prevents flash) -->
  <div id="bootScreen">Loading…</div>

  <!-- 2) Login (hidden until we know user is logged out) -->
  <div id="loginScreen" class="hidden">
    <h2>Welcome Back</h2>
    <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign In</button>
  </div>

  <!-- 3) Chat (hidden until we know user is logged in) -->
  <div id="chatUI" class="hidden">
    <div class="chat-box" id="chatBox"></div>
    <div class="input-container">
      <textarea id="messageInput" placeholder="Message..." rows="1"></textarea>
      <button class="btn-icon" id="sendBtn" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",
    authDomain: "striped-acrobat-342207.firebaseapp.com",
    databaseURL: "https://striped-acrobat-342207-default-rtdb.firebaseio.com",
    projectId: "striped-acrobat-342207",
    storageBucket: "striped-acrobat-342207.appspot.com",
    messagingSenderId: "367114842706",
    appId: "1:367114842706:web:0f6d504163ed3c72ed658b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const bootScreen   = document.getElementById("bootScreen");
  const loginScreen  = document.getElementById("loginScreen");
  const chatUI       = document.getElementById("chatUI");
  const chatBox      = document.getElementById("chatBox");
  const messageInput = document.getElementById("messageInput");
  const loginEmail   = document.getElementById("loginEmail");
  const loginPassword= document.getElementById("loginPassword");

  let messagesUnsub = null; // detach on logout

  // Store last known uid so cached messages render on the CORRECT side instantly
  const saveLocal   = (data) => localStorage.setItem("phonesms", JSON.stringify(data));
  const loadLocal   = () => JSON.parse(localStorage.getItem("phonesms") || "{}");
  const saveUid     = (uid)  => localStorage.setItem("phonesms_uid", uid || "");
  const loadUid     = ()     => localStorage.getItem("phonesms_uid") || null;

  function renderMessages(dataObj, uid) {
    chatBox.innerHTML = "";
    const keys = Object.keys(dataObj || {});
    if (!keys.length) return;

    keys
      .sort((a, b) => (dataObj[a].time || 0) - (dataObj[b].time || 0))
      .forEach(key => {
        const msg = dataObj[key];
        const div = document.createElement("div");
        const isSent = uid && msg.uid === uid;
        div.className = `message ${isSent ? "sent" : "received"}`;
        div.textContent = msg.text || "";
        div.addEventListener("dblclick", () => {
          if (confirm("Delete this message?")) {
            remove(ref(db, `phonesms/${key}`));
          }
        });
        chatBox.appendChild(div);
      });

    requestAnimationFrame(() => { chatBox.scrollTop = chatBox.scrollHeight; });
  }

  function sendMessage() {
    const text = messageInput.value.trim();
    if (text && auth.currentUser) {
      push(ref(db, "phonesms"), {
        text,
        uid: auth.currentUser.uid,
        time: Date.now()
      });
      messageInput.value = "";
      messageInput.style.height = "auto";
    }
  }

  document.getElementById("loginBtn").onclick = () => {
    const email = loginEmail.value.trim();
    const password = loginPassword.value;
    if (!email || !password) return alert("Please enter email and password.");
    signInWithEmailAndPassword(auth, email, password).catch(e => alert(e.message));
  };

  document.getElementById("logoutBtn").onclick = () => {
    signOut(auth);
  };

  document.getElementById("sendBtn").onclick = sendMessage;
  messageInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  messageInput.addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => {
      requestAnimationFrame(() => { chatBox.scrollTop = chatBox.scrollHeight; });
    });
  }

  // ------------------------------------------------------------------
  // AUTH STATE — the single source of truth for which screen to show
  // ------------------------------------------------------------------
  onAuthStateChanged(auth, user => {
    // Clean up any previous DB listener
    if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }

    if (user) {
      // ---- LOGGED IN ----
      saveUid(user.uid);

      // Show chat immediately, but render cached messages using the REAL uid
      bootScreen.classList.add("hidden");
      loginScreen.classList.add("hidden");
      chatUI.classList.remove("hidden");

      // 1) First paint: cached messages with the correct uid → no left/right jump
      const cached = loadLocal();
      if (Object.keys(cached).length) {
        renderMessages(cached, user.uid);
      }

      // 2) Then attach live listener
      const messagesRef = ref(db, "phonesms");
      const unsub = onValue(messagesRef, snapshot => {
        const data = snapshot.val() || {};
        saveLocal(data);
        renderMessages(data, user.uid);
      }, err => console.error("DB error:", err));
      messagesUnsub = unsub;

      setTimeout(() => messageInput.focus(), 150);

    } else {
      // ---- LOGGED OUT ----
      saveUid("");
      localStorage.removeItem("phonesms");

      chatBox.innerHTML = "";
      chatUI.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      bootScreen.classList.add("hidden");

      loginEmail.value = "";
      loginPassword.value = "";
    }
  });
</script>
</body>
</html>
