<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkVault — Cloud Bookmark Manager</title>

  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      sendEmailVerification,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      getDatabase,
      ref,
      push,
      remove,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",
      authDomain: "striped-acrobat-342207.firebaseapp.com",
      databaseURL: "https://striped-acrobat-342207-default-rtdb.firebaseio.com",
      projectId: "striped-acrobat-342207",
      storageBucket: "striped-acrobat-342207.appspot.com",
      messagingSenderId: "367114842706",
      appId: "1:367114842706:web:0f6d504163ed3c72ed658b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let allBookmarks = [];
    let currentFilter = "All";

    // Toast notification helper
    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.className = isError ? "toast show error" : "toast show";
      setTimeout(() => { toast.className = "toast"; }, 3500);
    }

    onAuthStateChanged(auth, (user) => {
      if (user && user.emailVerified) {
        document.getElementById("authView").style.display = "none";
        document.getElementById("appView").style.display = "flex";
        document.getElementById("userEmailDisplay").innerText = user.email;
        listenForBookmarks(user.uid);
      } else {
        document.getElementById("authView").style.display = "flex";
        document.getElementById("appView").style.display = "none";
        if (user && !user.emailVerified) {
          showToast("Please verify your email before logging in.", true);
          signOut(auth);
        }
      }
    });

    // Authentication Actions
    window.register = () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) return showToast("Enter email and password.", true);

      createUserWithEmailAndPassword(auth, email, password)
        .then(({ user }) => {
          sendEmailVerification(user).then(() => {
            showToast("Verification email sent! Check your inbox.");
            signOut(auth);
          });
        })
        .catch(err => showToast(err.message, true));
    };

    window.login = () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) return showToast("Enter email and password.", true);

      signInWithEmailAndPassword(auth, email, password)
        .catch(err => showToast("Login failed: " + err.message, true));
    };

    window.resetPassword = () => {
      const email = document.getElementById("email").value.trim();
      if (!email) return showToast("Enter your email first.", true);
      sendPasswordResetEmail(auth, email)
        .then(() => showToast("Password reset link sent to your email."))
        .catch(err => showToast(err.message, true));
    };

    window.logout = () => {
      signOut(auth).then(() => {
        allBookmarks = [];
        document.getElementById("bookmarkGrid").innerHTML = "";
        showToast("Logged out successfully.");
      });
    };

    // Bookmark CRUD Operations (Stored under a separate 'bookmarks_vault' node so it doesn't conflict with your existing chat 'messages' node)
    window.saveBookmark = (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const title = document.getElementById("bmTitle").value.trim();
      let url = document.getElementById("bmUrl").value.trim();
      const category = document.getElementById("bmCategory").value;

      if (!title || !url) return showToast("Title and URL are required.", true);
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;

      const userBookmarksRef = ref(db, `bookmarks_vault/${user.uid}`);
      push(userBookmarksRef, {
        title,
        url,
        category,
        createdAt: Date.now()
      }).then(() => {
        document.getElementById("bmTitle").value = "";
        document.getElementById("bmUrl").value = "";
        showToast("Bookmark saved!");
      }).catch(err => showToast(err.message, true));
    };

    window.deleteBookmark = (id) => {
      const user = auth.currentUser;
      if (!user) return;
      remove(ref(db, `bookmarks_vault/${user.uid}/${id}`))
        .then(() => showToast("Bookmark deleted."))
        .catch(err => showToast(err.message, true));
    };

    function listenForBookmarks(uid) {
      const userBookmarksRef = ref(db, `bookmarks_vault/${uid}`);
      onValue(userBookmarksRef, (snapshot) => {
        allBookmarks = [];
        snapshot.forEach((child) => {
          allBookmarks.unshift({ id: child.key, ...child.val() });
        });
        renderBookmarks();
      });
    }

    // Filtering & Search
    window.setFilter = (category, btnElement) => {
      currentFilter = category;
      document.querySelectorAll(".filter-chip").forEach(el => el.classList.remove("active"));
      btnElement.classList.add("active");
      renderBookmarks();
    };

    window.handleSearch = () => renderBookmarks();

    function renderBookmarks() {
      const grid = document.getElementById("bookmarkGrid");
      const query = document.getElementById("searchInput").value.toLowerCase();

      const filtered = allBookmarks.filter(bm => {
        const matchesCat = currentFilter === "All" || bm.category === currentFilter;
        const matchesSearch = bm.title.toLowerCase().includes(query) || bm.url.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No bookmarks found. Add one above!</div>`;
        return;
      }

      grid.innerHTML = filtered.map(bm => {
        let domain = "";
        try { domain = new URL(bm.url).hostname; } catch { domain = bm.url; }
        const favicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

        return `
          <div class="card">
            <div class="card-header">
              <img src="${favicon}" alt="" class="favicon" onerror="this.style.display='none'">
              <span class="badge">${bm.category}</span>
              <button class="delete-btn" onclick="deleteBookmark('${bm.id}')" title="Delete">✕</button>
            </div>
            <a href="${bm.url}" target="_blank" rel="noopener noreferrer" class="card-title">${escapeHTML(bm.title)}</a>
            <div class="card-url">${escapeHTML(domain)}</div>
          </div>
        `;
      }).join("");
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }
  </script>

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border-left: 4px solid var(--success);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transform: translateY(150%);
      transition: transform 0.3s ease;
      z-index: 1000;
      font-size: 14px;
    }
    .toast.show { transform: translateY(0); }
    .toast.error { border-left-color: var(--danger); }

    /* Auth Screen (Centered on Desktop & Phone) */
    #authView {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .auth-card h1 { font-size: 24px; margin-bottom: 6px; }
    .auth-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

    input, select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    button {
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
    }
    .btn-secondary:hover { background: var(--surface-hover); }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--primary);
      margin-bottom: 18px;
      cursor: pointer;
    }

    /* Main Dashboard Layout */
    #appView {
      display: none;
      flex-direction: column;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .user-controls { display: flex; align-items: center; gap: 12px; }
    .user-email { font-size: 13px; color: var(--text-muted); }
    .btn-logout {
      padding: 8px 14px;
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      font-size: 13px;
    }
    .btn-logout:hover { background: var(--danger); color: white; }

    /* Add Bookmark Bar (Responsive Flex/Grid) */
    .add-form {
      display: grid;
      grid-template-columns: 1fr 1.5fr 160px auto;
      gap: 12px;
      background: var(--surface);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .add-form input, .add-form select { margin-bottom: 0; }
    .add-form button { padding: 0 24px; margin-bottom: 0; white-space: nowrap; }

    /* Search & Filter Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .filter-chip {
      padding: 6px 14px;
      background: var(--surface);
      color: var(--text-muted);
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid var(--border);
    }
    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .search-box { max-width: 280px; width: 100%; margin-bottom: 0; }

    /* Responsive Bookmark Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--primary); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .favicon { width: 20px; height: 20px; border-radius: 4px; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      background: var(--bg);
      color: var(--text-muted);
      border-radius: 6px;
    }
    .delete-btn {
      margin-left: auto;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      padding: 4px 6px;
    }
    .delete-btn:hover { color: var(--danger); }

    .card-title {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-title:hover { color: var(--primary); }

    .card-url {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border-radius: 12px;
      border: 1px dashed var(--border);
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* Mobile Optimization */
    @media (max-width: 768px) {
      .add-form { grid-template-columns: 1fr; }
      .add-form button { padding: 12px; }
      .search-box { max-width: 100%; }
      .user-email { display: none; }
    }
  </style>
</head>
<body>

  <!-- Authentication View -->
  <div id="authView">
    <div class="auth-card">
      <h1>🔖 LinkVault</h1>
      <p>Sign in to access your synced cloud bookmarks.</p>
      <input type="email" id="email" placeholder="Email address" />
      <input type="password" id="password" placeholder="Password" />
      <span class="forgot-link" onclick="resetPassword()">Forgot Password?</span>
      <button class="btn-primary" onclick="login()">Log In</button>
      <button class="btn-secondary" onclick="register()">Create New Account</button>
    </div>
  </div>

  <!-- Main Bookmark App View -->
  <div id="appView">
    <header>
      <div class="brand">🔖 LinkVault</div>
      <div class="user-controls">
        <span class="user-email" id="userEmailDisplay"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </header>

    <form class="add-form" onsubmit="saveBookmark(event)">
      <input type="text" id="bmTitle" placeholder="Bookmark Title (e.g. GitHub)" required />
      <input type="text" id="bmUrl" placeholder="URL (e.g. github.com)" required />
      <select id="bmCategory">
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Learning">Learning</option>
        <option value="Tools">Tools</option>
      </select>
      <button type="submit" class="btn-primary">+ Save</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-chip active" onclick="setFilter('All', this)">All</button>
        <button class="filter-chip" onclick="setFilter('Work', this)">Work</button>
        <button class="filter-chip" onclick="setFilter('Personal', this)">Personal</button>
        <button class="filter-chip" onclick="setFilter('Learning', this)">Learning</button>
        <button class="filter-chip" onclick="setFilter('Tools', this)">Tools</button>
      </div>
      <input type="text" id="searchInput" class="search-box" placeholder="Search bookmarks..." oninput="handleSearch()" />
    </div>

    <div id="bookmarkGrid" class="grid"></div>
  </div>

  <footer>Made with ❤️ by Surendra Sonawane</footer>
  <div id="toast" class="toast"></div>

</body>
</html>
