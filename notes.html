<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Notes.</title>

<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>

<style>

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

/* LOGIN */

#loginScreen {
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.loginBox {
  width:100%;
  max-width:380px;
  background:white;
  padding:30px;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.loginBox h1 {
  text-align:center;
}

.loginBox input {
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.loginBox button {
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#1a73e8;
  color:white;
  font-size:16px;
}

#error {
  color:#d93025;
  margin-top:12px;
  font-size:14px;
}

/* APP */

#app {
  display:none;
}

.header {
  background:white;
  border-bottom:1px solid #ddd;
  padding:12px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  position:sticky;
  top:0;
  z-index:10;
}

.logo {
  font-size:21px;
  font-weight:bold;
}

.headerRight {
  display:flex;
  align-items:center;
  gap:10px;
}

.userEmail {
  font-size:13px;
  color:#666;
}

.logout {
  background:#e53935;
  color:white;
  border:0;
  border-radius:7px;
  padding:9px 13px;
}

/* TOOLBAR */

.toolbar {
  max-width:1200px;
  margin:auto;
  padding:18px;

  display:flex;
  gap:10px;
}

.search {
  flex:1;
  padding:12px 16px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
}

.newNote,
.newTodo {
  border:0;
  border-radius:9px;
  padding:11px 16px;
  color:white;
  cursor:pointer;
}

.newNote {
  background:#1a73e8;
}

.newTodo {
  background:#188038;
}

/* GRID */

.notes {
  max-width:1200px;
  margin:auto;
  padding:0 18px 40px;

  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}

/* CARD */

.card {
  padding:16px;
  border-radius:12px;
  border:1px solid rgba(0,0,0,.12);
  min-height:150px;
  position:relative;
  word-break:break-word;
}

.card:hover {
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.card.pinned {
  border:2px solid #fbbc04;
}

.pin {
  position:absolute;
  right:8px;
  top:8px;

  background:transparent;
  border:0;
  font-size:18px;
  cursor:pointer;
}

.title {
  font-size:18px;
  font-weight:bold;
  padding-right:30px;
  margin-bottom:10px;
}

.content {
  white-space:pre-wrap;
  line-height:1.5;
  color:#444;
}

.date {
  font-size:11px;
  color:#777;
  margin-top:12px;
}

.actions {
  display:flex;
  gap:6px;
  margin-top:12px;
}

.actions button {
  border:1px solid #ccc;
  background:white;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
}

/* TODO */

.task {
  display:flex;
  gap:8px;
  margin:8px 0;
}

.task input {
  width:18px;
  height:18px;
}

.taskText {
  flex:1;
}

.done {
  text-decoration:line-through;
  color:#777;
}

/* MODAL */

.modal {
  display:none;

  position:fixed;
  inset:0;

  background:rgba(0,0,0,.45);

  justify-content:center;
  align-items:center;

  padding:20px;

  z-index:50;
}

.modalBox {
  background:white;
  width:100%;
  max-width:600px;

  max-height:90vh;
  overflow:auto;

  border-radius:14px;
  padding:20px;
}

.modalBox input[type=text],
.modalBox textarea {
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  margin-bottom:12px;
}

.modalBox textarea {
  min-height:220px;
  resize:vertical;
}

.modalButtons {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

.save {
  background:#1a73e8;
  color:white;
  border:0;
  padding:10px 16px;
  border-radius:8px;
}

.cancel {
  background:#eee;
  border:0;
  padding:10px 16px;
  border-radius:8px;
}

/* TASK EDITOR */

.taskRow {
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

.taskRow input {
  flex:1;
  margin:0 !important;
}

.removeTask {
  background:#e53935;
  color:white;
  border:0;
  border-radius:7px;
  width:40px;
}

.addTask {
  background:#188038;
  color:white;
  border:0;
  padding:9px 13px;
  border-radius:7px;
}

/* COLORS */

.colors {
  display:flex;
  gap:8px;
  margin:10px 0;
}

.color {
  width:27px;
  height:27px;
  border-radius:50%;
  border:2px solid #888;
  cursor:pointer;
}

.empty {
  text-align:center;
  color:#777;
  padding:50px;
  grid-column:1/-1;
}

/* STATUS */

#status {
  display:none;
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);

  background:#333;
  color:white;

  padding:10px 18px;
  border-radius:20px;

  z-index:100;
}

@media(max-width:600px) {

  .toolbar {
    flex-wrap:wrap;
  }

  .search {
    flex-basis:100%;
  }

  .newNote,
  .newTodo {
    flex:1;
  }

  .userEmail {
    display:none;
  }

  .notes {
    grid-template-columns:1fr;
    padding:0 12px 30px;
  }

}

</style>
</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen">

  <div class="loginBox">

    <h1>📝 My Notes</h1>

    <p>
      Login to continue
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      Login
    </button>

    <div id="error"></div>

  </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="app">

  <div class="header">

    <div class="logo">
      📝 My Notes
    </div>

    <div class="headerRight">

      <span
        class="userEmail"
        id="userEmail"
      ></span>

      <button
        class="logout"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

  </div>


  <div class="toolbar">

    <input
      class="search"
      id="search"
      placeholder="🔍 Search notes..."
    >

    <button
      class="newNote"
      id="newNote"
    >
      + Note
    </button>

    <button
      class="newTodo"
      id="newTodo"
    >
      ☑ Todo
    </button>

  </div>


  <div
    class="notes"
    id="notes"
  ></div>

</div>


<!-- =====================================================
     NOTE MODAL
===================================================== -->

<div
  class="modal"
  id="noteModal"
>

  <div class="modalBox">

    <h2 id="noteModalTitle">
      New Note
    </h2>

    <input
      type="text"
      id="noteTitle"
      placeholder="Title"
    >

    <textarea
      id="noteContent"
      placeholder="Write your note..."
    ></textarea>


    <div class="colors">

      <div class="color"
           style="background:#fff"
           data-color="#ffffff"></div>

      <div class="color"
           style="background:#fff8b8"
           data-color="#fff8b8"></div>

      <div class="color"
           style="background:#d7f9df"
           data-color="#d7f9df"></div>

      <div class="color"
           style="background:#dcecff"
           data-color="#dcecff"></div>

      <div class="color"
           style="background:#ffdce5"
           data-color="#ffdce5"></div>

      <div class="color"
           style="background:#eadcff"
           data-color="#eadcff"></div>

      <div class="color"
           style="background:#ffe0b2"
           data-color="#ffe0b2"></div>

    </div>


    <div class="modalButtons">

      <button
        class="cancel"
        id="cancelNote"
      >
        Cancel
      </button>

      <button
        class="save"
        id="saveNote"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     TODO MODAL
===================================================== -->

<div
  class="modal"
  id="todoModal"
>

  <div class="modalBox">

    <h2>
      ☑ Todo List
    </h2>

    <input
      type="text"
      id="todoTitle"
      placeholder="Todo title"
    >

    <div id="taskEditor"></div>

    <button
      class="addTask"
      id="addTask"
    >
      + Add Task
    </button>


    <div class="colors">

      <div class="color"
           style="background:#fff"
           data-todo-color="#ffffff"></div>

      <div class="color"
           style="background:#fff8b8"
           data-todo-color="#fff8b8"></div>

      <div class="color"
           style="background:#d7f9df"
           data-todo-color="#d7f9df"></div>

      <div class="color"
           style="background:#dcecff"
           data-todo-color="#dcecff"></div>

      <div class="color"
           style="background:#ffdce5"
           data-todo-color="#ffdce5"></div>

      <div class="color"
           style="background:#eadcff"
           data-todo-color="#eadcff"></div>

    </div>


    <div class="modalButtons">

      <button
        class="cancel"
        id="cancelTodo"
      >
        Cancel
      </button>

      <button
        class="save"
        id="saveTodo"
      >
        Save Todo
      </button>

    </div>

  </div>

</div>


<div id="status"></div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",

  authDomain:
    "striped-acrobat-342207.firebaseapp.com",

  databaseURL:
    "https://striped-acrobat-342207-default-rtdb.firebaseio.com",

  projectId:
    "striped-acrobat-342207",

  storageBucket:
    "striped-acrobat-342207.appspot.com",

  messagingSenderId:
    "367114842706",

  appId:
    "1:367114842706:web:0f6d504163ed3c72ed658b"

};


firebase.initializeApp(firebaseConfig);

const auth =
  firebase.auth();

const db =
  firebase.database();


/*
   DATABASE:

   notes1
*/

const notesRef =
  db.ref("notes1");


/* =====================================================
   VARIABLES
===================================================== */

let notesData = {};

let editId = null;

let noteColor = "#ffffff";

let todoColor = "#ffffff";


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const app =
  document.getElementById(
    "app"
  );

const email =
  document.getElementById(
    "email"
  );

const password =
  document.getElementById(
    "password"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const notesBox =
  document.getElementById(
    "notes"
  );


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(
  function(user) {

    console.log(
      "Auth state:",
      user
    );


    if (user) {

      /*
        IMPORTANT:
        No emailVerified check here.
        Any Firebase authenticated user
        can enter the app.
      */

      loginScreen.style.display =
        "none";

      app.style.display =
        "block";

      document.getElementById(
        "userEmail"
      ).textContent =
        user.email || "";

      loadNotes();

    }

    else {

      loginScreen.style.display =
        "flex";

      app.style.display =
        "none";

    }

  }
);


/* =====================================================
   LOGIN
===================================================== */

document.getElementById(
  "loginBtn"
).onclick = async function() {

  errorBox.textContent =
    "Logging in...";


  const userEmail =
    email.value.trim();

  const userPassword =
    password.value;


  if (!userEmail) {

    errorBox.textContent =
      "Enter your email.";

    return;

  }

  if (!userPassword) {

    errorBox.textContent =
      "Enter your password.";

    return;

  }


  try {

    await auth.signInWithEmailAndPassword(
      userEmail,
      userPassword
    );


    errorBox.textContent =
      "";

  }

  catch(error) {

    console.error(error);


    /*
       Firebase gives useful errors
       such as:

       auth/user-not-found
       auth/wrong-password
       auth/invalid-email
       auth/too-many-requests
    */

    errorBox.textContent =
      firebaseError(error);

  }

};


/* =====================================================
   FIREBASE ERROR
===================================================== */

function firebaseError(error) {

  switch(error.code) {

    case "auth/user-not-found":
      return "User not found.";

    case "auth/wrong-password":
      return "Incorrect password.";

    case "auth/invalid-email":
      return "Invalid email address.";

    case "auth/user-disabled":
      return "This account has been disabled.";

    case "auth/too-many-requests":
      return "Too many attempts. Try again later.";

    case "auth/network-request-failed":
      return "Network error. Check your internet.";

    case "auth/invalid-credential":
      return "Invalid email or password.";

    default:
      return error.message;

  }

}


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

password.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      document.getElementById(
        "loginBtn"
      ).click();

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
  "logoutBtn"
).onclick = function() {

  auth.signOut();

};


/* =====================================================
   LOAD NOTES
===================================================== */

function loadNotes() {

  notesRef.on(
    "value",
    function(snapshot) {

      notesData =
        snapshot.val() || {};

      renderNotes();

    },
    function(error) {

      console.error(error);

      showStatus(
        "Database error: " +
        error.message
      );

    }
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderNotes() {

  notesBox.innerHTML =
    "";


  const search =
    document.getElementById(
      "search"
    ).value
    .toLowerCase()
    .trim();


  const list =
    Object.entries(notesData)
      .filter(function(entry) {

        const note =
          entry[1];

        const text =
          (
            (note.title || "") +
            " " +
            (note.content || "") +
            " " +
            getTasks(note)
          )
          .toLowerCase();

        return (
          !search ||
          text.includes(search)
        );

      })
      .sort(function(a,b) {

        if (
          a[1].pinned &&
          !b[1].pinned
        ) {

          return -1;

        }

        if (
          !a[1].pinned &&
          b[1].pinned
        ) {

          return 1;

        }

        return (
          (b[1].updatedAt || 0) -
          (a[1].updatedAt || 0)
        );

      });


  if (!list.length) {

    notesBox.innerHTML =
      '<div class="empty">' +
      '<h2>📝</h2>' +
      '<p>No notes found.</p>' +
      '</div>';

    return;

  }


  list.forEach(function(entry) {

    const id =
      entry[0];

    const note =
      entry[1];


    const card =
      document.createElement(
        "div"
      );

    card.className =
      "card";


    if (note.pinned) {

      card.classList.add(
        "pinned"
      );

    }


    card.style.background =
      note.color ||
      "#ffffff";


    /* PIN */

    const pin =
      document.createElement(
        "button"
      );

    pin.className =
      "pin";

    pin.textContent =
      note.pinned
        ? "📌"
        : "📍";

    pin.onclick =
      function() {

        togglePin(
          id,
          note
        );

      };

    card.appendChild(pin);


    /* TITLE */

    const title =
      document.createElement(
        "div"
      );

    title.className =
      "title";

    title.textContent =
      note.title ||
      (
        note.type === "todo"
          ? "Todo"
          : "Untitled"
      );

    card.appendChild(title);


    /* CONTENT */

    if (
      note.type === "todo"
    ) {

      renderTodo(
        card,
        id,
        note
      );

    }

    else {

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "content";

      content.textContent =
        note.content || "";

      card.appendChild(
        content
      );

    }


    /* DATE */

    const date =
      document.createElement(
        "div"
      );

    date.className =
      "date";

    date.textContent =
      formatDate(
        note.updatedAt
      );

    card.appendChild(date);


    /* ACTIONS */

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "actions";


    const edit =
      document.createElement(
        "button"
      );

    edit.textContent =
      "✏️ Edit";

    edit.onclick =
      function() {

        if (
          note.type === "todo"
        ) {

          openTodo(
            id,
            note
          );

        }

        else {

          openNote(
            id,
            note
          );

        }

      };


    const del =
      document.createElement(
        "button"
      );

    del.textContent =
      "🗑 Delete";

    del.onclick =
      function() {

        deleteNote(id);

      };


    actions.appendChild(
      edit
    );

    actions.appendChild(
      del
    );

    card.appendChild(
      actions
    );


    notesBox.appendChild(
      card
    );

  });

}


/* =====================================================
   TODO DISPLAY
===================================================== */

function renderTodo(
  card,
  noteId,
  note
) {

  if (!note.tasks) {
    return;
  }


  Object.entries(
    note.tasks
  ).forEach(
    function(entry) {

      const taskId =
        entry[0];

      const task =
        entry[1];


      const row =
        document.createElement(
          "div"
        );

      row.className =
        "task";


      const checkbox =
        document.createElement(
          "input"
        );

      checkbox.type =
        "checkbox";

      checkbox.checked =
        !!task.completed;


      checkbox.onchange =
        function() {

          toggleTask(
            noteId,
            taskId,
            checkbox.checked
          );

        };


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "taskText";

      text.textContent =
        task.text || "";


      if (task.completed) {

        text.classList.add(
          "done"
        );

      }


      row.appendChild(
        checkbox
      );

      row.appendChild(
        text
      );

      card.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   GET TASKS FOR SEARCH
===================================================== */

function getTasks(note) {

  if (!note.tasks) {
    return "";
  }

  return Object.values(
    note.tasks
  )
  .map(
    task =>
      task.text || ""
  )
  .join(" ");

}


/* =====================================================
   NEW NOTE
===================================================== */

document.getElementById(
  "newNote"
).onclick = function() {

  openNote(
    null,
    null
  );

};


/* =====================================================
   OPEN NOTE
===================================================== */

function openNote(
  id,
  note
) {

  editId =
    id;


  document.getElementById(
    "noteModalTitle"
  ).textContent =
    id
      ? "Edit Note"
      : "New Note";


  document.getElementById(
    "noteTitle"
  ).value =
    note
      ? note.title || ""
      : "";


  document.getElementById(
    "noteContent"
  ).value =
    note
      ? note.content || ""
      : "";


  noteColor =
    note
      ? note.color || "#ffffff"
      : "#ffffff";


  document.getElementById(
    "noteModal"
  ).style.display =
    "flex";

}


/* =====================================================
   SAVE NOTE
===================================================== */

document.getElementById(
  "saveNote"
).onclick = async function() {

  const title =
    document.getElementById(
      "noteTitle"
    ).value.trim();

  const content =
    document.getElementById(
      "noteContent"
    ).value;


  if (
    !title &&
    !content.trim()
  ) {

    showStatus(
      "Write something first."
    );

    return;

  }


  const id =
    editId ||
    notesRef.push().key;


  const old =
    notesData[id] || {};


  try {

    await notesRef
      .child(id)
      .set({

        type:
          "note",

        title:
          title,

        content:
          content,

        color:
          noteColor,

        pinned:
          !!old.pinned,

        createdAt:
          old.createdAt ||
          Date.now(),

        updatedAt:
          Date.now()

      });


    document.getElementById(
      "noteModal"
    ).style.display =
      "none";


    showStatus(
      "Note saved."
    );

  }

  catch(error) {

    showStatus(
      error.message
    );

  }

};


/* =====================================================
   NOTE COLORS
===================================================== */

document.querySelectorAll(
  "[data-color]"
).forEach(
  function(element) {

    element.onclick =
      function() {

        noteColor =
          element.dataset.color;

      };

  }
);


/* =====================================================
   CANCEL NOTE
===================================================== */

document.getElementById(
  "cancelNote"
).onclick =
  function() {

    document.getElementById(
      "noteModal"
    ).style.display =
      "none";

  };


/* =====================================================
   NEW TODO
===================================================== */

document.getElementById(
  "newTodo"
).onclick =
  function() {

    openTodo(
      null,
      null
    );

  };


/* =====================================================
   OPEN TODO
===================================================== */

function openTodo(
  id,
  note
) {

  editId =
    id;


  document.getElementById(
    "todoTitle"
  ).value =
    note
      ? note.title || ""
      : "";


  todoColor =
    note
      ? note.color || "#ffffff"
      : "#ffffff";


  const editor =
    document.getElementById(
      "taskEditor"
    );

  editor.innerHTML =
    "";


  if (
    note &&
    note.tasks
  ) {

    Object.values(
      note.tasks
    ).forEach(
      function(task) {

        addTask(
          task.text || ""
        );

      }
    );

  }


  if (!editor.children.length) {

    addTask("");

  }


  document.getElementById(
    "todoModal"
  ).style.display =
    "flex";

}


/* =====================================================
   ADD TASK
===================================================== */

function addTask(
  text = ""
) {

  const editor =
    document.getElementById(
      "taskEditor"
    );


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "taskRow";


  const input =
    document.createElement(
      "input"
    );

  input.type =
    "text";

  input.placeholder =
    "Task";

  input.value =
    text;


  const remove =
    document.createElement(
      "button"
    );

  remove.className =
    "removeTask";

  remove.textContent =
    "×";


  remove.onclick =
    function() {

      row.remove();

    };


  row.appendChild(
    input
  );

  row.appendChild(
    remove
  );


  editor.appendChild(
    row
  );

}


document.getElementById(
  "addTask"
).onclick =
  function() {

    addTask("");

  };

/* =====================================================
   SAVE TODO
===================================================== */

document.getElementById(
  "saveTodo"
).onclick =
  async function() {

    const title =
      document.getElementById(
        "todoTitle"
      ).value.trim();


    const inputs =
      document.querySelectorAll(
        "#taskEditor input[type=text]"
      );


    const tasks = {};


    inputs.forEach(
      function(input) {

        const text =
          input.value.trim();


        if (!text) {
          return;
        }


        const taskId =
          notesRef.push().key;


        tasks[taskId] = {

          text:
            text,

          completed:
            false

        };

      }
    );


    if (
      !title &&
      !Object.keys(tasks).length
    ) {

      showStatus(
        "Add a title or task."
      );

      return;

    }


    const id =
      editId ||
      notesRef.push().key;


    const old =
      notesData[id] || {};


    /*
       Preserve completed status
       when editing.
    */

    if (old.tasks) {

      const oldTasks =
        Object.values(
          old.tasks
        );


      Object.values(
        tasks
      ).forEach(
        function(task) {

          const oldTask =
            oldTasks.find(
              function(item) {

                return (
                  item.text ===
                  task.text
                );

              }
            );


          if (oldTask) {

            task.completed =
              !!oldTask.completed;

          }

        }
      );

    }


    try {

      await notesRef
        .child(id)
        .set({

          type:
            "todo",

          title:
            title,

          tasks:
            tasks,

          color:
            todoColor,

          pinned:
            !!old.pinned,

          createdAt:
            old.createdAt ||
            Date.now(),

          updatedAt:
            Date.now()

        });


      document.getElementById(
        "todoModal"
      ).style.display =
        "none";


      showStatus(
        "Todo saved."
      );

    }

    catch(error) {

      showStatus(
        error.message
      );

    }

  };

/* =====================================================
   DELETE
===================================================== */

async function deleteNote(id) {

  const note =
    notesData[id];


  const name =
    note.title ||
    "this note";


  if (
    !confirm(
      'Delete "' +
      name +
      '"?'
    )
  ) {

    return;

  }


  try {

    await notesRef
      .child(id)
      .remove();


    showStatus(
      "Deleted."
    );

  }

  catch(error) {

    showStatus(
      error.message
    );

  }

}


/* =====================================================
   PIN
===================================================== */

async function togglePin(
  id,
  note
) {

  try {

    await notesRef
      .child(id)
      .update({

        pinned:
          !note.pinned,

        updatedAt:
          Date.now()

      });

  }

  catch(error) {

    showStatus(
      error.message
    );

  }

}


/* =====================================================
   TODO CHECKBOX
===================================================== */

async function toggleTask(
  noteId,
  taskId,
  checked
) {

  try {

    await notesRef
      .child(noteId)
      .child("tasks")
      .child(taskId)
      .update({

        completed:
          checked

      });


    await notesRef
      .child(noteId)
      .update({

        updatedAt:
          Date.now()

      });

  }

  catch(error) {

    showStatus(
      error.message
    );

  }

}

/* =====================================================
   DATE
===================================================== */

function formatDate(
  timestamp
) {

  if (!timestamp) {
    return "";
  }


  return new Date(
    timestamp
  ).toLocaleString();

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  message
) {

  const box =
    document.getElementById(
      "status"
    );


  box.textContent =
    message;

  box.style.display =
    "block";


  setTimeout(
    function() {

      box.style.display =
        "none";

    },
    2500
  );

}
