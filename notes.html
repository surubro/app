<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Notes</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #202124;
}

/* =========================
   HEADER
========================= */

.header {
  height: 65px;
  background: white;
  border-bottom: 1px solid #ddd;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 18px;

  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-email {
  font-size: 13px;
  color: #666;
}

button {
  border: none;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.logout-btn {
  background: #e53935;
  color: white;
}

/* =========================
   LOGIN
========================= */

#loginScreen {
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 400px;

  background: white;
  padding: 28px;

  border-radius: 14px;

  box-shadow: 0 3px 20px rgba(0,0,0,.10);
}

.login-card h1 {
  margin-top: 0;
  margin-bottom: 8px;
}

.login-card p {
  color: #666;
  margin-bottom: 25px;
}

.login-card input {
  width: 100%;

  padding: 13px;

  border: 1px solid #ccc;
  border-radius: 8px;

  margin-bottom: 12px;

  font-size: 15px;
}

.login-btn {
  width: 100%;
  background: #1a73e8;
  color: white;
}

.login-error {
  color: #d93025;
  margin-top: 12px;
  font-size: 14px;
}

/* =========================
   APP
========================= */

#app {
  display: none;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
  max-width: 1200px;
  margin: auto;

  padding: 18px;

  display: flex;
  gap: 10px;

  flex-wrap: wrap;
}

.search {
  flex: 1;
  min-width: 200px;

  padding: 12px 15px;

  border: 1px solid #ccc;
  border-radius: 10px;

  font-size: 15px;

  background: white;
}

.new-note-btn {
  background: #1a73e8;
  color: white;
}

.new-todo-btn {
  background: #188038;
  color: white;
}

/* =========================
   NOTES GRID
========================= */

.notes-container {
  max-width: 1200px;
  margin: auto;

  padding: 0 18px 40px;

  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(260px, 1fr));

  gap: 16px;
}

/* =========================
   NOTE CARD
========================= */

.note-card {
  border-radius: 12px;

  border: 1px solid rgba(0,0,0,.12);

  padding: 16px;

  min-height: 160px;

  position: relative;

  transition: .15s;

  word-break: break-word;
}

.note-card:hover {
  box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

.note-pinned {
  border: 2px solid #fbbc04;
}

.note-title {
  font-size: 18px;
  font-weight: bold;

  margin-bottom: 10px;

  padding-right: 35px;
}

.note-content {
  white-space: pre-wrap;

  line-height: 1.5;

  font-size: 14px;

  color: #444;
}

.note-date {
  font-size: 11px;
  color: #777;

  margin-top: 14px;
}

.note-actions {
  display: flex;
  gap: 5px;

  margin-top: 14px;
}

.note-actions button {
  padding: 7px 9px;

  background: rgba(255,255,255,.7);

  border: 1px solid rgba(0,0,0,.12);
}

.pin-button {
  position: absolute;

  right: 12px;
  top: 12px;

  background: transparent !important;

  border: none !important;

  font-size: 18px;
}

/* =========================
   TODO
========================= */

.todo-item {
  display: flex;

  align-items: flex-start;

  gap: 8px;

  margin: 8px 0;
}

.todo-item input {
  margin-top: 3px;
}

.todo-text {
  flex: 1;

  font-size: 14px;

  line-height: 1.4;
}

.todo-completed {
  text-decoration: line-through;

  color: #777;
}

/* =========================
   EMPTY
========================= */

.empty {
  max-width: 1200px;

  margin: 60px auto;

  text-align: center;

  color: #777;

  padding: 20px;
}

/* =========================
   MODAL
========================= */

.modal {
  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.45);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  z-index: 100;
}

.modal-box {
  width: 100%;
  max-width: 600px;

  max-height: 90vh;

  overflow-y: auto;

  background: white;

  border-radius: 14px;

  padding: 20px;
}

.modal-box h2 {
  margin-top: 0;
}

.modal-box input[type="text"],
.modal-box textarea {
  width: 100%;

  border: 1px solid #ccc;

  border-radius: 8px;

  padding: 12px;

  font-size: 15px;

  margin-bottom: 12px;
}

.modal-box textarea {
  min-height: 200px;

  resize: vertical;
}

.modal-buttons {
  display: flex;

  justify-content: flex-end;

  gap: 8px;

  margin-top: 15px;
}

.cancel-btn {
  background: #eee;
}

.save-btn {
  background: #1a73e8;

  color: white;
}

/* =========================
   TODO EDITOR
========================= */

.task-row {
  display: flex;

  gap: 7px;

  margin-bottom: 9px;
}

.task-row input {
  flex: 1;

  margin: 0 !important;
}

.remove-task {
  background: #e53935;

  color: white;

  padding: 8px 11px;
}

.add-task {
  background: #188038;

  color: white;

  margin-bottom: 10px;
}

/* =========================
   COLORS
========================= */

.color-picker {
  display: flex;

  gap: 8px;

  margin: 8px 0 15px;
}

.color {
  width: 27px;
  height: 27px;

  border-radius: 50%;

  border: 2px solid #777;

  cursor: pointer;
}

.color-white {
  background: #ffffff;
}

.color-yellow {
  background: #fff8b8;
}

.color-green {
  background: #d7f9df;
}

.color-blue {
  background: #dcecff;
}

.color-pink {
  background: #ffdce5;
}

.color-purple {
  background: #eadcff;
}

.color-orange {
  background: #ffe0b2;
}

/* =========================
   STATUS
========================= */

.status {
  position: fixed;

  bottom: 18px;
  left: 50%;

  transform: translateX(-50%);

  background: #323232;

  color: white;

  padding: 9px 15px;

  border-radius: 20px;

  font-size: 13px;

  display: none;

  z-index: 200;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .header {
    padding: 0 12px;
  }

  .user-email {
    display: none;
  }

  .toolbar {
    padding: 12px;
  }

  .notes-container {
    padding: 0 12px 30px;
    grid-template-columns: 1fr;
  }

  .new-note-btn,
  .new-todo-btn {
    flex: 1;
  }

}

</style>
</head>

<body>


<!-- =====================================================
     LOGIN SCREEN
====================================================== -->

<div id="loginScreen">

  <div class="login-card">

    <h1>📝 My Notes</h1>

    <p>
      Login to access your Notes and Todo list.
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      id="loginBtn"
    >
      Login
    </button>

    <div
      class="login-error"
      id="loginError"
    ></div>

  </div>

</div>


<!-- =====================================================
     MAIN APP
====================================================== -->

<div id="app">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      📝 My Notes
    </div>

    <div class="header-right">

      <span
        class="user-email"
        id="userEmail"
      ></span>

      <button
        class="logout-btn"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- TOOLBAR -->

  <div class="toolbar">

    <input
      type="search"
      id="searchInput"
      class="search"
      placeholder="🔍 Search notes..."
    >

    <button
      class="new-note-btn"
      id="newNoteBtn"
    >
      + Note
    </button>

    <button
      class="new-todo-btn"
      id="newTodoBtn"
    >
      ☑ Todo
    </button>

  </div>


  <!-- NOTES -->

  <div
    class="notes-container"
    id="notesContainer"
  ></div>

  <div
    class="empty"
    id="emptyMessage"
    style="display:none;"
  >
    <h2>No notes yet</h2>
    <p>Create your first note or Todo.</p>
  </div>

</div>


<!-- =====================================================
     NOTE MODAL
====================================================== -->

<div
  class="modal"
  id="noteModal"
>

  <div class="modal-box">

    <h2 id="noteModalTitle">
      New Note
    </h2>

    <input
      type="text"
      id="noteTitle"
      placeholder="Title"
    >

    <textarea
      id="noteContent"
      placeholder="Write your note..."
    ></textarea>

    <label>
      Note color
    </label>

    <div class="color-picker">

      <div
        class="color color-white"
        data-color="#ffffff"
      ></div>

      <div
        class="color color-yellow"
        data-color="#fff8b8"
      ></div>

      <div
        class="color color-green"
        data-color="#d7f9df"
      ></div>

      <div
        class="color color-blue"
        data-color="#dcecff"
      ></div>

      <div
        class="color color-pink"
        data-color="#ffdce5"
      ></div>

      <div
        class="color color-purple"
        data-color="#eadcff"
      ></div>

      <div
        class="color color-orange"
        data-color="#ffe0b2"
      ></div>

    </div>

    <div class="modal-buttons">

      <button
        class="cancel-btn"
        id="cancelNoteBtn"
      >
        Cancel
      </button>

      <button
        class="save-btn"
        id="saveNoteBtn"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     TODO MODAL
====================================================== -->

<div
  class="modal"
  id="todoModal"
>

  <div class="modal-box">

    <h2>
      ☑ Todo List
    </h2>

    <input
      type="text"
      id="todoTitle"
      placeholder="Todo list title"
    >

    <div id="taskEditor"></div>

    <button
      class="add-task"
      id="addTaskBtn"
    >
      + Add Task
    </button>

    <div class="color-picker">

      <div
        class="color color-white"
        data-todo-color="#ffffff"
      ></div>

      <div
        class="color color-yellow"
        data-todo-color="#fff8b8"
      ></div>

      <div
        class="color color-green"
        data-todo-color="#d7f9df"
      ></div>

      <div
        class="color color-blue"
        data-todo-color="#dcecff"
      ></div>

      <div
        class="color color-pink"
        data-todo-color="#ffdce5"
      ></div>

      <div
        class="color color-purple"
        data-todo-color="#eadcff"
      ></div>

      <div
        class="color color-orange"
        data-todo-color="#ffe0b2"
      ></div>

    </div>

    <div class="modal-buttons">

      <button
        class="cancel-btn"
        id="cancelTodoBtn"
      >
        Cancel
      </button>

      <button
        class="save-btn"
        id="saveTodoBtn"
      >
        Save Todo
      </button>

    </div>

  </div>

</div>


<!-- STATUS -->

<div
  class="status"
  id="status"
></div>


<script>

/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",

  authDomain:
    "striped-acrobat-342207.firebaseapp.com",

  databaseURL:
    "https://striped-acrobat-342207-default-rtdb.firebaseio.com",

  projectId:
    "striped-acrobat-342207",

  storageBucket:
    "striped-acrobat-342207.appspot.com",

  messagingSenderId:
    "367114842706",

  appId:
    "1:367114842706:web:0f6d504163ed3c72ed658b"

};


/* =========================================================
   FIREBASE INITIALIZE
========================================================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.database();


/*
   Everything for this app is stored under:

   notes1

   Example:

   notes1
      noteID
         type
         title
         content
         tasks
         pinned
         color
         createdAt
         updatedAt
*/

const notesRef = db.ref("notes1");


/* =========================================================
   VARIABLES
========================================================= */

let allNotes = {};

let editingNoteId = null;

let selectedNoteColor = "#ffffff";

let selectedTodoColor = "#ffffff";


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const logoutBtn =
  document.getElementById("logoutBtn");

const userEmail =
  document.getElementById("userEmail");

const searchInput =
  document.getElementById("searchInput");

const notesContainer =
  document.getElementById("notesContainer");

const emptyMessage =
  document.getElementById("emptyMessage");

const newNoteBtn =
  document.getElementById("newNoteBtn");

const newTodoBtn =
  document.getElementById("newTodoBtn");

const noteModal =
  document.getElementById("noteModal");

const todoModal =
  document.getElementById("todoModal");

const noteTitle =
  document.getElementById("noteTitle");

const noteContent =
  document.getElementById("noteContent");

const todoTitle =
  document.getElementById("todoTitle");

const taskEditor =
  document.getElementById("taskEditor");

const statusBox =
  document.getElementById("status");


/* =========================================================
   STATUS
========================================================= */

let statusTimer;

function showStatus(message) {

  statusBox.textContent = message;

  statusBox.style.display = "block";

  clearTimeout(statusTimer);

  statusTimer = setTimeout(() => {

    statusBox.style.display = "none";

  }, 2000);

}


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(function(user) {

  if (user && user.emailVerified) {

    loginScreen.style.display = "none";

    app.style.display = "block";

    userEmail.textContent = user.email;

    loadNotes();

  }

  else {

    loginScreen.style.display = "flex";

    app.style.display = "none";

  }

});


/* =========================================================
   LOGIN
========================================================= */

loginBtn.onclick = async function() {

  const userEmailValue =
    email.value.trim();

  const userPassword =
    password.value;

  loginError.textContent = "";

  if (!userEmailValue || !userPassword) {

    loginError.textContent =
      "Enter email and password.";

    return;

  }

  try {

    const result =
      await auth.signInWithEmailAndPassword(
        userEmailValue,
        userPassword
      );

    if (!result.user.emailVerified) {

      loginError.textContent =
        "Please verify your email first.";

      await auth.signOut();

      return;

    }

  }

  catch(error) {

    loginError.textContent =
      error.message;

  }

};


/* =========================================================
   ENTER TO LOGIN
========================================================= */

password.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      loginBtn.click();

    }

  }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.onclick = async function() {

  await auth.signOut();

};


/* =========================================================
   LOAD ALL NOTES
========================================================= */

function loadNotes() {

  notesRef.on("value", function(snapshot) {

    allNotes =
      snapshot.val() || {};

    renderNotes();

  });

}


/* =========================================================
   RENDER NOTES
========================================================= */

function renderNotes() {

  notesContainer.innerHTML = "";

  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  let notesArray =
    Object.entries(allNotes);


  /*
     Pinned notes first
  */

  notesArray.sort(function(a, b) {

    const noteA = a[1];

    const noteB = b[1];

    if (noteA.pinned && !noteB.pinned) {
      return -1;
    }

    if (!noteA.pinned && noteB.pinned) {
      return 1;
    }

    return (
      (noteB.updatedAt || 0) -
      (noteA.updatedAt || 0)
    );

  });


  let displayed = 0;


  notesArray.forEach(function(entry) {

    const id = entry[0];

    const note = entry[1];


    const searchableText =
      (
        (note.title || "") +
        " " +
        (note.content || "") +
        " " +
        getTaskSearchText(note)
      ).toLowerCase();


    if (
      search &&
      !searchableText.includes(search)
    ) {

      return;

    }


    displayed++;

    const card =
      createNoteCard(id, note);

    notesContainer.appendChild(card);

  });


  if (displayed === 0) {

    emptyMessage.style.display = "block";

  }

  else {

    emptyMessage.style.display = "none";

  }

}


/* =========================================================
   TASK SEARCH TEXT
========================================================= */

function getTaskSearchText(note) {

  if (!note.tasks) {
    return "";
  }

  return Object.values(note.tasks)
    .map(task => task.text || "")
    .join(" ");

}


/* =========================================================
   CREATE NOTE CARD
========================================================= */

function createNoteCard(id, note) {

  const card =
    document.createElement("div");

  card.className = "note-card";

  if (note.pinned) {

    card.classList.add("note-pinned");

  }

  card.style.background =
    note.color || "#ffffff";


  /* PIN */

  const pin =
    document.createElement("button");

  pin.className = "pin-button";

  pin.innerHTML =
    note.pinned ? "📌" : "📍";

  pin.title =
    note.pinned
      ? "Unpin"
      : "Pin";

  pin.onclick = function(event) {

    event.stopPropagation();

    togglePin(id, note);

  };

  card.appendChild(pin);


  /* TITLE */

  const title =
    document.createElement("div");

  title.className =
    "note-title";

  title.textContent =
    note.title ||
    (
      note.type === "todo"
        ? "Todo"
        : "Untitled"
    );

  card.appendChild(title);


  /* CONTENT */

  if (note.type === "todo") {

    renderTodoCard(
      card,
      id,
      note
    );

  }

  else {

    const content =
      document.createElement("div");

    content.className =
      "note-content";

    content.textContent =
      note.content || "";

    card.appendChild(content);

  }


  /* DATE */

  const date =
    document.createElement("div");

  date.className =
    "note-date";

  date.textContent =
    formatDate(note.updatedAt);

  card.appendChild(date);


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "note-actions";


  const edit =
    document.createElement("button");

  edit.textContent = "✏️ Edit";

  edit.onclick = function() {

    if (note.type === "todo") {

      openTodoEditor(id, note);
