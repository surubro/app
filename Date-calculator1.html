<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Difference Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #333;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
      color: #1a1a2e;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .today-box {
      background: #f0f4ff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 24px;
      text-align: center;
      font-size: 0.95rem;
    }

    .today-box strong {
      color: #4f46e5;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    input[type="date"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 28px;
      padding: 20px;
      border-radius: 12px;
      background: #f8fafc;
      display: none;
    }

    .result.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
    }

    .result-title.past {
      color: #dc2626;
    }

    .result-title.future {
      color: #059669;
    }

    .result-title.today {
      color: #4f46e5;
    }

    .diff-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .diff-item {
      background: white;
      border-radius: 10px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .diff-item .number {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.2;
    }

    .diff-item .label {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .total-days {
      text-align: center;
      margin-top: 16px;
      font-size: 0.95rem;
      color: #475569;
    }

    .total-days strong {
      color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Date Calculator</h1>
    <p class="subtitle">See how many years, months & days have passed or are upcoming</p>

    <div class="today-box">
      Today is <strong id="todayDisplay"></strong>
    </div>

    <label for="selectedDate">Select a date</label>
    <input type="date" id="selectedDate">

    <button onclick="calculateDifference()">Calculate Difference</button>

    <div class="result" id="result">
      <div class="result-title" id="resultTitle"></div>
      <div class="diff-grid">
        <div class="diff-item">
          <div class="number" id="years">0</div>
          <div class="label">Years</div>
        </div>
        <div class="diff-item">
          <div class="number" id="months">0</div>
          <div class="label">Months</div>
        </div>
        <div class="diff-item">
          <div class="number" id="days">0</div>
          <div class="label">Days</div>
        </div>
      </div>
      <div class="total-days">
        Total: <strong id="totalDays">0</strong> days
      </div>
    </div>
  </div>

  <script>
    // Show today's date
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('todayDisplay').textContent = today.toLocaleDateString('en-US', options);

    // Set max date far in future (optional)
    const selectedInput = document.getElementById('selectedDate');
    // selectedInput.max = new Date().toISOString().split('T')[0]; // uncomment to only allow past dates

    function calculateDifference() {
      const selectedValue = selectedInput.value;
      if (!selectedValue) {
        alert('Please select a date');
        return;
      }

      const selected = new Date(selectedValue);
      selected.setHours(0, 0, 0, 0);

      const resultEl = document.getElementById('result');
      const titleEl = document.getElementById('resultTitle');

      // Same day
      if (selected.getTime() === today.getTime()) {
        titleEl.textContent = "That's today!";
        titleEl.className = 'result-title today';
        document.getElementById('years').textContent = 0;
        document.getElementById('months').textContent = 0;
        document.getElementById('days').textContent = 0;
        document.getElementById('totalDays').textContent = 0;
        resultEl.classList.add('show');
        return;
      }

      const isPast = selected < today;
      const start = isPast ? selected : today;
      const end = isPast ? today : selected;

      // Calculate years, months, days
      let years = end.getFullYear() - start.getFullYear();
      let months = end.getMonth() - start.getMonth();
      let days = end.getDate() - start.getDate();

      if (days < 0) {
        months--;
        // Get days in the previous month of the end date
        const prevMonth = new Date(end.getFullYear(), end.getMonth(), 0);
        days += prevMonth.getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      // Total days difference
      const msPerDay = 1000 * 60 * 60 * 24;
      const totalDays = Math.round((end - start) / msPerDay);

      // Update UI
      document.getElementById('years').textContent = years;
      document.getElementById('months').textContent = months;
      document.getElementById('days').textContent = days;
      document.getElementById('totalDays').textContent = totalDays.toLocaleString();

      if (isPast) {
        titleEl.textContent = 'Time Passed';
        titleEl.className = 'result-title past';
      } else {
        titleEl.textContent = 'Time Upcoming';
        titleEl.className = 'result-title future';
      }

      resultEl.classList.add('show');
    }

    // Optional: calculate on date change
    selectedInput.addEventListener('change', calculateDifference);
  </script>
</body>
</html>
