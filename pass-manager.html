<!DOCTYPE html>

<head>

    <style>

        /* Modal */
        #modalOverlay {
            position: fixed;

        @media (max-width: 600px) {

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        getDatabase,
        ref,
        push,
        onValue,
        remove,
        update
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


    const firebaseConfig = {

        apiKey: "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",

        authDomain:
            "striped-acrobat-342207.firebaseapp.com",

        databaseURL:
            "https://striped-acrobat-342207-default-rtdb.firebaseio.com",

        projectId:
            "striped-acrobat-342207",

        storageBucket:
            "striped-acrobat-342207.appspot.com",

        messagingSenderId:
            "367114842706",

        appId:
            "1:367114842706:web:0f6d504163ed3c72ed658b"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);

    let currentUser = null;

    let allData = {};


    /*
        AUTH STATE
    */

    onAuthStateChanged(auth, (user) => {

        currentUser = user;

        document
            .getElementById('authSection')
            .classList
            .toggle('hidden', !!user);

        document
            .getElementById('appSection')
            .classList
            .toggle('hidden', !user);

        if (user) {

            loadData(user.uid);

        }

    });


    /*
        SAVE ENTRY
    */

    document
        .getElementById('saveBtn')
        .onclick = () => {

            const name =
                document.getElementById('accName').value.trim();

            if (!name) {

                alert("Please enter Account Name.");

                return;

            }

            if (!currentUser) return;


            const data = {

                name: name,

                user:
                    document.getElementById('accUser').value,

                pass:
                    document.getElementById('accPass').value,

                image:
                    document.getElementById('accImage').value.trim(),

                e1:
                    document.getElementById('e1').value,

                e2:
                    document.getElementById('e2').value,

                e3:
                    document.getElementById('e3').value,

                e4:
                    document.getElementById('e4').value,

                e5:
                    document.getElementById('e5').value,

                e6:
                    document.getElementById('e6').value

            };


            push(
                ref(db, `users/${currentUser.uid}`),
                data
            )
            .then(() => {

                [
                    'accName',
                    'accUser',
                    'accPass',
                    'accImage',
                    'e1',
                    'e2',
                    'e3',
                    'e4',
                    'e5',
                    'e6'
                ]
                .forEach(id => {

                    document
                        .getElementById(id)
                        .value = '';

                });

            })
            .catch(error => {

                alert(error.message);

            });

        };


    /*
        LOAD DATA
    */

    function loadData(uid) {

        onValue(
            ref(db, `users/${uid}`),
            (snapshot) => {

                allData =
                    snapshot.val() || {};

                renderData();

            }
        );

    }


    /*
        SEARCH
    */

    document
        .getElementById('searchInput')
        .addEventListener('input', function() {

            const value =
                this.value.toLowerCase().trim();

            document
                .getElementById('clearSearch')
                .style.display =
                    value ? 'block' : 'none';

            renderData();

        });


    /*
        CLEAR SEARCH
    */

    document
        .getElementById('clearSearch')
        .onclick = () => {

            document
                .getElementById('searchInput')
                .value = '';

            document
                .getElementById('clearSearch')
                .style.display = 'none';

            renderData();

        };


    /*
        RENDER DATA
    */

    function renderData() {

        const list =
            document.getElementById('passwordList');

        list.innerHTML = '';

        const search =
            document
                .getElementById('searchInput')
                .value
                .toLowerCase()
                .trim();


        let count = 0;


        for (let id in allData) {

            const item = allData[id];


            /*
                SEARCH THROUGH ALL FIELDS
            */

            const searchableText = [

                item.name,
                item.user,
                item.e1,
                item.e2,
                item.e3,
                item.e4,
                item.e5,
                item.e6

            ]
            .join(' ')
            .toLowerCase();


            if (
                search &&
                !searchableText.includes(search)
            ) {

                continue;

            }


            count++;


            const card =
                document.createElement('div');

            card.className =
                'entry-card';


            /*
                HEADER
            */

            const header =
                document.createElement('div');

            header.className =
                'entry-header';


            const name =
                document.createElement('span');

            name.className =
                'entry-name';

            name.textContent =
                item.name || 'Unnamed';


            /*
                CLICK NAME TO SHOW IMAGE
            */

            if (item.image) {

                name.title =
                    'Click to view image';

                name.onclick = () => {

                    window.showImage(item.image);

                };

            }


            header.appendChild(name);

            card.appendChild(header);


            /*
                IMAGE PREVIEW
            */

            const imagePreview =
                document.createElement('div');

            imagePreview.className =
                'image-preview';

            imagePreview.id =
                'image-' + id;


            if (item.image) {

                const label =
                    document.createElement('div');

                label.className =
                    'image-label';

                label.textContent =
                    'Account Image';


                const img =
                    document.createElement('img');

                img.src =
                    item.image;

                img.alt =
                    item.name || 'Image';


                img.onerror = () => {

                    label.textContent =
                        'Image could not be loaded';

                };


                imagePreview.appendChild(label);

                imagePreview.appendChild(img);

            }


            card.appendChild(imagePreview);


            /*
                USERNAME + PASSWORD
            */

            const details =
                document.createElement('div');

            details.className =
                'details-grid';


            const userDiv =
                document.createElement('div');

            userDiv.innerHTML =
                `<strong>User:</strong> ` +
                escapeHTML(item.user || '-');


            const passDiv =
                document.createElement('div');


            const passLabel =
                document.createElement('strong');

            passLabel.textContent =
                'Pass:';


            const passSpan =
                document.createElement('span');

            passSpan.id =
                'p-' + id;

            passSpan.textContent =
                '••••••';


            const toggle =
                document.createElement('span');

            toggle.className =
                'toggle-text';

            toggle.textContent =
                'Show';


            toggle.onclick = () => {

                if (
                    passSpan.textContent ===
                    '••••••'
                ) {

                    passSpan.textContent =
                        item.pass || '';

                    toggle.textContent =
                        'Hide';

                } else {

                    passSpan.textContent =
                        '••••••';

                    toggle.textContent =
                        'Show';

                }

            };


            passDiv.appendChild(passLabel);

            passDiv.appendChild(
                document.createTextNode(' ')
            );

            passDiv.appendChild(passSpan);

            passDiv.appendChild(toggle);


            details.appendChild(userDiv);

            details.appendChild(passDiv);

            card.appendChild(details);


            /*
                EXTRA DETAILS
            */

            const extras =
                document.createElement('div');

            extras.className =
                'details-grid';

            extras.style =
                'color:#666; border-top:1px dashed #eee; padding-top:8px;';


            const extraFields = [
                ['E1', item.e1],
                ['E2', item.e2],
                ['E3', item.e3],
                ['E4', item.e4],
                ['E5', item.e5],
                ['E6', item.e6]
            ];


            extraFields.forEach(([label, value]) => {

                const div =
                    document.createElement('div');

                const strong =
                    document.createElement('strong');

                strong.textContent =
                    label + ':';

                div.appendChild(strong);

                div.appendChild(
                    document.createTextNode(
                        ' ' + (value || '-')
                    )
                );

                extras.appendChild(div);

            });


            card.appendChild(extras);


            /*
                BUTTONS
            */

            const editButton =
                document.createElement('button');

            editButton.className =
                'btn btn-warning';

            editButton.textContent =
                'Edit';

            editButton.onclick = () => {

                window.openEditModal(id);

            };


            const deleteButton =
                document.createElement('button');

            deleteButton.className =
                'btn btn-danger';

            deleteButton.textContent =
                'Delete';

            deleteButton.onclick = () => {

                window.deleteItem(id);

            };


            card.appendChild(editButton);

            card.appendChild(deleteButton);


            list.appendChild(card);

        }


        document
            .getElementById('searchCount')
            .textContent =
                search
                    ? `${count} result(s) found`
                    : `${count} stored entr${count === 1 ? 'y' : 'ies'}`;

    }


    /*
        SHOW FULL IMAGE
    */

    window.showImage = (imageURL) => {

        if (!imageURL) return;

        const modal =
            document.getElementById('imageModal');

        const image =
            document.getElementById('fullImage');

        image.src =
            imageURL;

        modal.classList.remove('hidden');

    };


    /*
        CLOSE IMAGE
    */

    window.closeImageModal = () => {

        document
            .getElementById('imageModal')
            .classList
            .add('hidden');

        document
            .getElementById('fullImage')
            .src = '';

    };


    /*
        EDIT MODAL
    */

    window.openEditModal = (id) => {

        const d =
            allData[id];

        if (!d) return;


        document
            .getElementById('editId')
            .value = id;

        document
            .getElementById('editName')
            .value = d.name || '';

        document
            .getElementById('editUser')
            .value = d.user || '';

        document
            .getElementById('editPass')
            .value = d.pass || '';

        document
            .getElementById('editImage')
            .value = d.image || '';

        document
            .getElementById('editE1')
            .value = d.e1 || '';

        document
            .getElementById('editE2')
            .value = d.e2 || '';

        document
            .getElementById('editE3')
            .value = d.e3 || '';

        document
            .getElementById('editE4')
            .value = d.e4 || '';

        document
            .getElementById('editE5')
            .value = d.e5 || '';

        document
            .getElementById('editE6')
            .value = d.e6 || '';


        document
            .getElementById('modalOverlay')
            .classList
            .remove('hidden');

    };


    /*
        UPDATE ENTRY
    */

    document
        .getElementById('updateBtn')
        .onclick = () => {

            const id =
                document
                    .getElementById('editId')
                    .value;


            update(
                ref(
                    db,
                    `users/${currentUser.uid}/${id}`
                ),
                {

                    name:
                        document
                            .getElementById('editName')
                            .value,

                    user:
                        document
                            .getElementById('editUser')
                            .value,

                    pass:
                        document
                            .getElementById('editPass')
                            .value,

                    image:
                        document
                            .getElementById('editImage')
                            .value,

                    e1:
                        document
                            .getElementById('editE1')
                            .value,

                    e2:
                        document
                            .getElementById('editE2')
                            .value,

                    e3:
                        document
                            .getElementById('editE3')
                            .value,

                    e4:
                        document
                            .getElementById('editE4')
                            .value,

                    e5:
                        document
                            .getElementById('editE5')
                            .value,

                    e6:
                        document
                            .getElementById('editE6')
                            .value

                }
            )
            .then(() => {

                document
                    .getElementById('modalOverlay')
                    .classList
                    .add('hidden');

            })
            .catch(error => {

                alert(error.message);

            });

        };


    /*
        CLOSE EDIT MODAL
    */

    document
        .getElementById('closeModal')
        .onclick = () => {

            document
                .getElementById('modalOverlay')
                .classList
                .add('hidden');

        };


    /*
        DELETE
    */

    window.deleteItem = (id) => {

        if (
            confirm("Delete this entry?")
        ) {

            remove(
                ref(
                    db,
                    `users/${currentUser.uid}/${id}`
                )
            );

        }

    };


    /*
        LOGOUT
    */

    document
        .getElementById('logoutBtn')
        .onclick = () => {

            signOut(auth);

        };


    /*
        LOGIN / SIGNUP
    */

    let isLogin = true;


    document
        .getElementById('toggleAuth')
        .onclick = () => {

            isLogin = !isLogin;

            document
                .getElementById('authTitle')
                .innerText =
                    isLogin
                        ? "Vault Login"
                        : "Create Account";

            document
                .getElementById('authBtn')
                .innerText =
                    isLogin
                        ? "Login"
                        : "Sign Up";

            document
                .getElementById('toggleAuth')
                .innerText =
                    isLogin
                        ? "New? Create Account"
                        : "Already have an account? Login";

        };


    document
        .getElementById('authBtn')
        .onclick = () => {

            const e =
                document
                    .getElementById('email')
                    .value;

            const p =
                document
                    .getElementById('authPassword')
                    .value;


            if (isLogin) {

                signInWithEmailAndPassword(
                    auth,
                    e,
                    p
                )
                .catch(a => alert(a.message));

            } else {

                createUserWithEmailAndPassword(
                    auth,
                    e,
                    p
                )
                .catch(a => alert(a.message));

            }

        };


    /*
        ESCAPE HTML
        Prevent stored text from being interpreted
        as HTML.
    */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    /*
        ESC KEY CLOSES IMAGE
    */

    document.addEventListener(
        'keydown',
        (event) => {

            if (event.key === 'Escape') {
