<script type="module">


    /* ==========================================
       FIREBASE IMPORTS
    =========================================== */

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,

    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    import {

        ref,
        push,

        remove,
        update
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";



    /* ==========================================
       FIREBASE CONFIG
    =========================================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",

        authDomain:
            "striped-acrobat-342207.firebaseapp.com",

        databaseURL:
            "https://striped-acrobat-342207-default-rtdb.firebaseio.com",

        projectId:
            "striped-acrobat-342207",

        storageBucket:
            "striped-acrobat-342207.appspot.com",

        messagingSenderId:
            "367114842706",

        appId:
            "1:367114842706:web:0f6d504163ed3c72ed658b"

    };


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getDatabase(app);


    let currentUser = null;

    let allData = {};



    /* ==========================================
       IMAGE VARIABLES
    =========================================== */

    let currentImages = [];

    let currentImageIndex = 0;



    /* ==========================================
       ADD ENTRY COLLAPSE
    =========================================== */

    const addEntryBtn =
        document.getElementById(
            'addEntryBtn'
        );


    const entryForm =
        document.getElementById(
            'entryForm'
        );


    const cancelAddBtn =
        document.getElementById(
            'cancelAddBtn'
        );


    addEntryBtn.onclick = () => {


        const isHidden =
            entryForm.classList
                .contains('hidden');


        if (isHidden) {

            entryForm
                .classList
                .remove('hidden');

            addEntryBtn.textContent =
                '➖ Close Add Entry';

        }
        else {

            closeAddEntryForm();

        }

    };



    cancelAddBtn.onclick = () => {

        closeAddEntryForm();

    };



    function closeAddEntryForm() {

        entryForm
            .classList
            .add('hidden');

        addEntryBtn.textContent =
            '➕ Add New Entry';

    }



    /* ==========================================
       AUTH STATE
    =========================================== */

    onAuthStateChanged(
        auth,
        (user) => {


            currentUser = user;


            document
                .getElementById(
                    'authSection'
                )
                .classList
                .toggle(
                    'hidden',
                    !!user
                );


            document
                .getElementById(
                    'appSection'
                )
                .classList
                .toggle(
                    'hidden',
                    !user
                );


            if (user) {

                loadData(
                    user.uid
                );

            }

        }
    );



    /* ==========================================
       SAVE ENTRY
    =========================================== */

    document
        .getElementById('saveBtn')
        .onclick = () => {


            if (!currentUser) {
                return;
            }


            const name =
                document
                    .getElementById(
                        'accName'
                    )
                    .value
                    .trim();


            if (!name) {

                alert(
                    'Please enter Account Name.'
                );

                return;

            }


            const data = {

                name:
                    name,

                user:
                    document
                        .getElementById(
                            'accUser'
                        )
                        .value
                        .trim(),

                pass:
                    document
                        .getElementById(
                            'accPass'
                        )
                        .value,

                /*
                    Store multiple image
                    filenames as comma-separated text.

                    Example:

                    image1.jpg,image2.jpg
                */

                image:
                    document
                        .getElementById(
                            'accImage'
                        )
                        .value
                        .trim(),

                e1:
                    document
                        .getElementById(
                            'e1'
                        )
                        .value,

                e2:
                    document
                        .getElementById(
                            'e2'
                        )
                        .value,

                e3:
                    document
                        .getElementById(
                            'e3'
                        )
                        .value,

                e4:
                    document
                        .getElementById(
                            'e4'
                        )
                        .value,

                e5:
                    document
                        .getElementById(
                            'e5'
                        )
                        .value,

                e6:
                    document
                        .getElementById(
                            'e6'
                        )
                        .value

            };


            push(
                ref(
                    db,
                    `users/${currentUser.uid}`
                ),
                data
            )
            .then(
                () => {


                    clearAddForm();


                    closeAddEntryForm();


                    alert(
                        'Entry saved successfully.'
                    );

                }
            )
            .catch(
                error => {

                    alert(
                        error.message
                    );

                }
            );

        };



    /* ==========================================
       CLEAR ADD FORM
    =========================================== */

    function clearAddForm() {

        [
            'accName',
            'accUser',
            'accPass',
            'accImage',
            'e1',
            'e2',
            'e3',
            'e4',
            'e5',
            'e6'
        ]
        .forEach(
            id => {

                document
                    .getElementById(id)
                    .value = '';

            }
        );

    }



    /* ==========================================
       LOAD DATA
    =========================================== */

    function loadData(uid) {


        onValue(
            ref(
                db,
                `users/${uid}`
            ),
            snapshot => {


                allData =
                    snapshot.val() || {};


                renderData();

            }
        );

    }



    /* ==========================================
       SEARCH
    =========================================== */

    document
        .getElementById(
            'searchInput'
        )
        .addEventListener(
            'input',
            () => {

                updateSearchButton();

                renderData();

            }
        );



    function updateSearchButton() {

        const value =
            document
                .getElementById(
                    'searchInput'
                )
                .value
                .trim();


        document
            .getElementById(
                'clearSearch'
            )
            .style
            .display =
                value
                    ? 'block'
                    : 'none';

    }



    document
        .getElementById(
            'clearSearch'
        )
        .onclick = () => {


            document
                .getElementById(
                    'searchInput'
                )
                .value = '';


            updateSearchButton();


            renderData();

        };



    /* ==========================================
       RENDER DATA
    =========================================== */

    function renderData() {


        const list =
            document
                .getElementById(
                    'passwordList'
                );


        list.innerHTML = '';


        const search =
            document
                .getElementById(
                    'searchInput'
                )
                .value
                .toLowerCase()
                .trim();


        let count = 0;


        for (
            const id in allData
        ) {


            const item =
                allData[id];


            const searchableText = [

                item.name || '',

                item.user || '',

                item.image || '',

                item.e1 || '',

                item.e2 || '',

                item.e3 || '',

                item.e4 || '',

                item.e5 || '',

                item.e6 || ''

            ]
            .join(' ')
            .toLowerCase();


            if (
                search &&
                !searchableText
                    .includes(search)
            ) {

                continue;

            }


            count++;



            /* ==================================
               CARD
            =================================== */

            const card =
                document
                    .createElement(
                        'div'
                    );


            card.className =
                'entry-card';



            /* ==================================
               NAME
            =================================== */

            const header =
                document
                    .createElement(
                        'div'
                    );


            header.className =
                'entry-header';


            header.textContent =
                item.name ||
                'Unnamed';


            card.appendChild(
                header
            );



            /* ==================================
               DETAILS
            =================================== */

            const details =
                document
                    .createElement(
                        'div'
                    );


            details.className =
                'details-grid';



            /* USER */

            const userDiv =
                document
                    .createElement(
                        'div'
                    );


            userDiv.innerHTML =
                '<strong>User:</strong> ' +
                escapeHTML(
                    item.user || '-'
                );


            details.appendChild(
                userDiv
            );



            /* PASSWORD */

            const passDiv =
                document
                    .createElement(
                        'div'
                    );


            const passStrong =
                document
                    .createElement(
                        'strong'
                    );


            passStrong.textContent =
                'Pass:';


            const passSpan =
                document
                    .createElement(
                        'span'
                    );


            passSpan.textContent =
                '••••••';


            const toggle =
                document
                    .createElement(
                        'span'
                    );


            toggle.className =
                'toggle-text';


            toggle.textContent =
                'Show';


            toggle.onclick = () => {


                if (
                    passSpan.textContent ===
                    '••••••'
                ) {

                    passSpan.textContent =
                        item.pass || '';

                    toggle.textContent =
                        'Hide';

                }
                else {

                    passSpan.textContent =
                        '••••••';

                    toggle.textContent =
                        'Show';

                }

            };


            passDiv.appendChild(
                passStrong
            );


            passDiv.appendChild(
                document
                    .createTextNode(
                        ' '
                    )
            );


            passDiv.appendChild(
                passSpan
            );


            passDiv.appendChild(
                toggle
            );


            details.appendChild(
                passDiv
            );


            card.appendChild(
                details
            );



            /* ==================================
               EXTRA FIELDS
            =================================== */

            const extras =
                document
                    .createElement(
                        'div'
                    );


            extras.className =
                'details-grid';


            extras.style =
                `
                color:#666;
                border-top:1px dashed #eee;
                padding-top:8px;
                `;


            const extraFields = [

                ['E1', item.e1],

                ['E2', item.e2],

                ['E3', item.e3],

                ['E4', item.e4],

                ['E5', item.e5],

                ['E6', item.e6]

            ];


            extraFields.forEach(
                ([label, value]) => {


                    const div =
                        document
                            .createElement(
                                'div'
                            );


                    div.innerHTML =
                        '<strong>' +
                        label +
                        ':</strong> ' +
                        escapeHTML(
                            value || '-'
                        );


                    extras.appendChild(
                        div
                    );

                }
            );


            card.appendChild(
                extras
            );



            /* ==================================
               BUTTONS
            =================================== */

            const buttons =
                document
                    .createElement(
                        'div'
                    );


            buttons.className =
                'entry-buttons';



            /* IMAGE BUTTON */

            if (
                item.image &&
                item.image.trim()
            ) {


                const imageButton =
                    document
                        .createElement(
                            'button'
                        );


                imageButton.className =
                    'btn btn-image';


                const images =
                    getImageList(
                        item.image
                    );


                imageButton.textContent =
                    `🖼️ Show Images (${images.length})`;


                imageButton.onclick =
                    () => {

                        window.showImages(
                            images
                        );

                    };


                buttons.appendChild(
                    imageButton
                );

            }



            /* EDIT */

            const editButton =
                document
                    .createElement(
                        'button'
                    );


            editButton.className =
                'btn btn-warning';


            editButton.textContent =
                'Edit';


            editButton.onclick =
                () => {

                    window.openEditModal(
                        id
                    );

                };


            buttons.appendChild(
                editButton
            );



            /* DELETE */

            const deleteButton =
                document
                    .createElement(
                        'button'
                    );


            deleteButton.className =
                'btn btn-danger';


            deleteButton.textContent =
                'Delete';


            deleteButton.onclick =
                () => {

                    window.deleteItem(
                        id
                    );

                };


            buttons.appendChild(
                deleteButton
            );


            card.appendChild(
                buttons
            );


            list.appendChild(
                card
            );

        }



        /* SEARCH INFO */

        document
            .getElementById(
                'searchInfo'
            )
            .textContent =
                search
                    ? `${count} result(s) found`
                    : `${count} stored entr${count === 1 ? 'y' : 'ies'}`;


        if (
            count === 0 &&
            search
        ) {

            list.innerHTML = `

                <div
                    style="
                        text-align:center;
                        padding:25px;
                        color:#777;
                    "
                >
                    No matching entries found.
                </div>

            `;

        }

    }



    /* ==========================================
       GET IMAGE LIST
    =========================================== */

    function getImageList(imageValue) {


        if (
            !imageValue
        ) {

            return [];

        }


        /*
            Supports:

            image1.jpg,image2.jpg

            and:

            image1.jpg, image2.jpg
        */

        return imageValue
            .split(',')
            .map(
                image =>
                    image.trim()
            )
            .filter(
                image =>
                    image.length > 0
            );

    }



    /* ==========================================
       SHOW MULTIPLE IMAGES
    =========================================== */

    window.showImages =
        (images) => {


            if (
                !images ||
                images.length === 0
            ) {

                return;

            }


            currentImages =
                images;


            currentImageIndex =
                0;


            showCurrentImage();

        };



    /* ==========================================
       SHOW CURRENT IMAGE
    =========================================== */

    function showCurrentImage() {


        if (
            currentImages.length === 0
        ) {

            return;

        }


        const image =
            document
                .getElementById(
                    'fullImage'
                );


        const modal =
            document
                .getElementById(
                    'imageModal'
                );


        const error =
            document
                .getElementById(
                    'imageError'
                );


        const counter =
            document
                .getElementById(
                    'imageCounter'
                );


        const previous =
            document
                .getElementById(
                    'prevImageBtn'
                );


        const next =
            document
                .getElementById(
                    'nextImageBtn'
                );


        /*
            Completely reset old image state.
        */

        image.onload = null;

        image.onerror = null;

        image.src = '';


        error.style.display =
            'none';


        const imageName =
            currentImages[
                currentImageIndex
            ];


        const imagePath =
            './' + imageName;


        counter.textContent =
            `${currentImageIndex + 1} / ${currentImages.length}`;


        previous.style.display =
            currentImages.length > 1
                ? 'block'
                : 'none';


        next.style.display =
            currentImages.length > 1
                ? 'block'
                : 'none';



        /*
            IMAGE SUCCESS
        */

        image.onload = () => {

            error.style.display =
                'none';

            modal
                .classList
                .remove('hidden');

        };



        /*
            IMAGE NOT FOUND

            IMPORTANT:
            No repeated alert.

            The modal closes and the
            error message is shown once.
        */

        image.onerror = () => {


            image.onload = null;

            image.onerror = null;


            image.src = '';


            modal
                .classList
                .add('hidden');


            error.style.display =
                'none';


            alert(
                'Image not found:\n\n' +
                imagePath +
                '\n\n' +
                'Check the filename and repository path.'
            );


            /*
                Clear everything after OK.
            */

            currentImages = [];

            currentImageIndex = 0;


            counter.textContent =
                '1 / 1';

        };


        /*
            Start loading.
        */

        image.src =
            imagePath;

    }



    /* ==========================================
       NEXT IMAGE
    =========================================== */

    document
        .getElementById(
            'nextImageBtn'
        )
        .onclick = () => {


            if (
                currentImages.length <= 1
            ) {

                return;

            }


            currentImageIndex++;


            if (
                currentImageIndex >=
                currentImages.length
            ) {

                currentImageIndex = 0;

            }


            showCurrentImage();

        };



    /* ==========================================
       PREVIOUS IMAGE
    =========================================== */

    document
        .getElementById(
            'prevImageBtn'
        )
        .onclick = () => {


            if (
                currentImages.length <= 1
            ) {

                return;

            }


            currentImageIndex--;


            if (
                currentImageIndex < 0
            ) {

                currentImageIndex =
                    currentImages.length - 1;

            }


            showCurrentImage();

        };



    /* ==========================================
       CLOSE IMAGE
    =========================================== */

    function closeImageViewer() {


        const modal =
            document
                .getElementById(
                    'imageModal'
                );


        const image =
            document
                .getElementById(
                    'fullImage'
                );


        image.onload = null;

        image.onerror = null;

        image.src = '';


        modal
            .classList
            .add('hidden');


        currentImages = [];

        currentImageIndex = 0;

    }


    document
        .getElementById(
            'closeImageBtn'
        )
        .onclick =
            closeImageViewer;



    /* ==========================================
       CLICK IMAGE BACKGROUND TO CLOSE
    =========================================== */

    document
        .getElementById(
            'imageModal'
        )
        .onclick =
            (event) => {


                if (
                    event.target.id ===
                    'imageModal'
                ) {

                    closeImageViewer();

                }

            };



    /* ==========================================
       EDIT MODAL
    ========================================== */

    window.openEditModal =
        (id) => {


            const item =
                allData[id];


            if (!item) {

                return;

            }


            document
                .getElementById(
                    'editId'
                )
                .value = id;


            document
                .getElementById(
                    'editName'
                )
                .value =
                    item.name || '';


            document
                .getElementById(
                    'editUser'
                )
                .value =
                    item.user || '';


            document
                .getElementById(
                    'editPass'
                )
                .value =
                    item.pass || '';


            document
                .getElementById(
                    'editImage'
                )
                .value =
                    item.image || '';


            document
                .getElementById(
                    'editE1'
                )
                .value =
                    item.e1 || '';


            document
                .getElementById(
                    'editE2'
                )
                .value =
                    item.e2 || '';


            document
                .getElementById(
                    'editE3'
                )
                .value =
                    item.e3 || '';


            document
                .getElementById(
                    'editE4'
                )
                .value =
                    item.e4 || '';


            document
                .getElementById(
                    'editE5'
                )
                .value =
                    item.e5 || '';


            document
                .getElementById(
                    'editE6'
                )
                .value =
                    item.e6 || '';


            document
                .getElementById(
                    'modalOverlay'
                )
                .classList
                .remove('hidden');

        };



    /* ==========================================
       UPDATE
    =========================================== */

    document
        .getElementById(
            'updateBtn'
        )
        .onclick = () => {


            if (!currentUser) {

                return;

            }


            const id =
                document
                    .getElementById(
                        'editId'
                    )
                    .value;


            const updatedData = {

                name:
                    document
                        .getElementById(
                            'editName'
                        )
                        .value
                        .trim(),

                user:
                    document
                        .getElementById(
                            'editUser'
                        )
                        .value
                        .trim(),

                pass:
                    document
                        .getElementById(
                            'editPass'
                        )
                        .value,

                image:
                    document
                        .getElementById(
                            'editImage'
                        )
                        .value
                        .trim(),

                e1:
                    document
                        .getElementById(
                            'editE1'
                        )
                        .value,

                e2:
                    document
                        .getElementById(
                            'editE2'
                        )
                        .value,

                e3:
                    document
                        .getElementById(
                            'editE3'
                        )
                        .value,

                e4:
                    document
                        .getElementById(
                            'editE4'
                        )
                        .value,

                e5:
                    document
                        .getElementById(
                            'editE5'
                        )
                        .value,

                e6:
                    document
                        .getElementById(
                            'editE6'
                        )
                        .value

            };


            update(
                ref(
                    db,
                    `users/${currentUser.uid}/${id}`
                ),
                updatedData
            )
            .then(
                () => {

                    document
                        .getElementById(
                            'modalOverlay'
                        )
                        .classList
                        .add('hidden');

                }
            )
            .catch(
                error => {

                    alert(
                        error.message
                    );

                }
            );

        };



    /* ==========================================
       CLOSE EDIT MODAL
    =========================================== */

    document
        .getElementById(
            'closeModal'
        )
        .onclick = () => {


            document
                .getElementById(
                    'modalOverlay'
                )
                .classList
                .add('hidden');

        };



    /* ==========================================
       DELETE
    =========================================== */

    window.deleteItem =
        (id) => {


            if (!currentUser) {

                return;

            }


            if (
                confirm(
                    'Delete this entry?'
                )
            ) {


                remove(
                    ref(
                        db,
                        `users/${currentUser.uid}/${id}`
                    )
                )
                .catch(
                    error => {

                        alert(
                            error.message
                        );

                    }
                );

            }

        };



    /* ==========================================
       LOGOUT
    =========================================== */

    document
        .getElementById(
            'logoutBtn'
        )
        .onclick = () => {

            signOut(auth);

        };



    /* ==========================================
       LOGIN / SIGNUP SWITCH
    =========================================== */

    let isLogin = true;


    document
        .getElementById(
            'toggleAuth'
        )
        .onclick = () => {


            isLogin =
                !isLogin;


            document
                .getElementById(
                    'authTitle'
                )
                .textContent =
                    isLogin
                        ? 'Vault Login'
                        : 'Create Account';


            document
                .getElementById(
                    'authBtn'
                )
                .textContent =
                    isLogin
                        ? 'Login'
                        : 'Sign Up';


            document
                .getElementById(
                    'toggleAuth'
                )
                .textContent =
                    isLogin
                        ? 'New? Create Account'
                        : 'Already have an account? Login';

        };



    /* ==========================================
       LOGIN / SIGNUP
    =========================================== */

    document
        .getElementById(
            'authBtn'
        )
        .onclick = () => {


            const email =
                document
                    .getElementById(
                        'email'
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        'authPassword'
                    )
                    .value;


            if (
                !email ||
                !password
            ) {

                alert(
                    'Please enter email and password.'
                );

                return;

            }


            if (isLogin) {


                signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                )
                .catch(
                    error => {

                        alert(
                            error.message
                        );

                    }
                );


            }
            else {


                createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                )
                .catch(
                    error => {

                        alert(
                            error.message
                        );

                    }
                );

            }

        };



    /* ==========================================
       ESC KEY
    =========================================== */

    document
        .addEventListener(
            'keydown',
            event => {


                if (
                    event.key === 'Escape'
                ) {


                    closeImageViewer();


                    document
                        .getElementById(
                            'modalOverlay'
                        )
                        .classList
                        .add('hidden');

                }

            }
        );



    /* ==========================================
       HTML ESCAPE
    =========================================== */

    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                '&amp;'
            )

            .replace(
                /</g,
                '&lt;'
            )

            .replace(
                />/g,
                '&gt;'
            )

            .replace(
                /"/g,
                '&quot;'
            )

            .replace(
                /'/g,
                '&#039;'
            );

    }

</script>
