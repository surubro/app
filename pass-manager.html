<script type="module">


    /* =====================================================
       FIREBASE
    ===================================================== */

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    from

    import {
        getDatabase,
        ref,
        push,
        onValue,
        remove,
        update
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";



    const firebaseConfig = {

        apiKey:
            "AIzaSyBxbzsSi-dsFPPGDeogz2SaEsW_3OKu-QU",

        authDomain:
            "striped-acrobat-342207.firebaseapp.com",

        databaseURL:
            "https://striped-acrobat-342207-default-rtdb.firebaseio.com",

        projectId:
            "striped-acrobat-342207",

        storageBucket:
            "striped-acrobat-342207.appspot.com",

        messagingSenderId:
            "367114842706",

        appId:
            "1:367114842706:web:0f6d504163ed3c72ed658b"

    };


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getDatabase(app);


    let currentUser = null;


    let allData = {};



    /* =====================================================
       AUTH STATE
    ===================================================== */

    onAuthStateChanged(
        auth,
        (user) => {

            currentUser = user;


            document
                .getElementById('authSection')
                .classList
                .toggle(
                    'hidden',
                    !!user
                );


            document
                .getElementById('appSection')
                .classList
                .toggle(
                    'hidden',
                    !user
                );


            if (user) {

                loadData(
                    user.uid
                );

            }

        }
    );



    /* =====================================================
       SAVE
    ===================================================== */

    document
        .getElementById('saveBtn')
        .onclick = () => {


            if (!currentUser) {

                return;

            }


            const name =
                document
                    .getElementById('accName')
                    .value
                    .trim();


            if (!name) {

                alert(
                    "Please enter Account Name."
                );

                return;

            }


            const data = {

                name:
                    name,

                user:
                    document
                        .getElementById('accUser')
                        .value
                        .trim(),

                pass:
                    document
                        .getElementById('accPass')
                        .value,

                /*
                    IMPORTANT:

                    Only the filename/path is stored.

                    Example:
                    image1.jpg

                    OR:

                    images/image1.jpg
                */

                image:
                    document
                        .getElementById('accImage')
                        .value
                        .trim(),

                e1:
                    document
                        .getElementById('e1')
                        .value,

                e2:
                    document
                        .getElementById('e2')
                        .value,

                e3:
                    document
                        .getElementById('e3')
                        .value,

                e4:
                    document
                        .getElementById('e4')
                        .value,

                e5:
                    document
                        .getElementById('e5')
                        .value,

                e6:
                    document
                        .getElementById('e6')
                        .value

            };


            push(
                ref(
                    db,
                    `users/${currentUser.uid}`
                ),
                data
            )
            .then(() => {


                [
                    'accName',
                    'accUser',
                    'accPass',
                    'accImage',
                    'e1',
                    'e2',
                    'e3',
                    'e4',
                    'e5',
                    'e6'
                ]
                .forEach(
                    id => {

                        document
                            .getElementById(id)
                            .value = '';

                    }
                );


                alert(
                    "Entry saved successfully."
                );

            })
            .catch(
                error => {

                    alert(
                        error.message
                    );

                }
            );

        };



    /* =====================================================
       LOAD DATA
    ===================================================== */

    function loadData(uid) {


        onValue(
            ref(
                db,
                `users/${uid}`
            ),
            (snapshot) => {


                allData =
                    snapshot.val() || {};


                renderData();

            }
        );

    }



    /* =====================================================
       SEARCH
    ===================================================== */

    document
        .getElementById('searchInput')
        .addEventListener(
            'input',
            () => {

                updateClearButton();

                renderData();

            }
        );



    function updateClearButton() {


        const input =
            document
                .getElementById('searchInput');


        document
            .getElementById('clearSearch')
            .style
            .display =
                input.value.trim()
                    ? 'block'
                    : 'none';

    }



    document
        .getElementById('clearSearch')
        .onclick = () => {


            document
                .getElementById('searchInput')
                .value = '';


            updateClearButton();


            renderData();

        };



    /* =====================================================
       RENDER DATA
    ===================================================== */

    function renderData() {


        const list =
            document
                .getElementById('passwordList');


        list.innerHTML = '';


        const search =
            document
                .getElementById('searchInput')
                .value
                .toLowerCase()
                .trim();


        let count = 0;


        for (
            const id in allData
        ) {


            const item =
                allData[id];


            /*
                SEARCH ALL IMPORTANT FIELDS
            */

            const searchableText = [

                item.name || '',

                item.user || '',

                item.image || '',

                item.e1 || '',

                item.e2 || '',

                item.e3 || '',

                item.e4 || '',

                item.e5 || '',

                item.e6 || ''

            ]
            .join(' ')
            .toLowerCase();


            if (
                search &&
                !searchableText
                    .includes(search)
            ) {

                continue;

            }


            count++;


            /* =================================================
               CARD
            ================================================= */

            const card =
                document
                    .createElement('div');


            card.className =
                'entry-card';



            /* =================================================
               ACCOUNT NAME
            ================================================= */

            const header =
                document
                    .createElement('div');


            header.className =
                'entry-header';


            const name =
                document
                    .createElement('span');


            name.className =
                'entry-name';


            name.textContent =
                item.name ||
                'Unnamed';


            header.appendChild(
                name
            );


            card.appendChild(
                header
            );



            /* =================================================
               USER + PASSWORD
            ================================================= */

            const details =
                document
                    .createElement('div');


            details.className =
                'details-grid';



            /* USER */

            const userDiv =
                document
                    .createElement('div');


            const userStrong =
                document
                    .createElement('strong');


            userStrong.textContent =
                'User:';


            userDiv.appendChild(
                userStrong
            );


            userDiv.appendChild(
                document
                    .createTextNode(
                        ' ' +
                        (item.user || '-')
                    )
            );



            /* PASSWORD */

            const passDiv =
                document
                    .createElement('div');


            const passStrong =
                document
                    .createElement('strong');


            passStrong.textContent =
                'Pass:';


            const passSpan =
                document
                    .createElement('span');


            passSpan.textContent =
                '••••••';


            const toggle =
                document
                    .createElement('span');


            toggle.className =
                'toggle-text';


            toggle.textContent =
                'Show';


            toggle.onclick = () => {


                if (
                    passSpan.textContent ===
                    '••••••'
                ) {

                    passSpan.textContent =
                        item.pass || '';

                    toggle.textContent =
                        'Hide';

                }
                else {

                    passSpan.textContent =
                        '••••••';

                    toggle.textContent =
                        'Show';

                }

            };


            passDiv.appendChild(
                passStrong
            );


            passDiv.appendChild(
                document
                    .createTextNode(' ')
            );


            passDiv.appendChild(
                passSpan
            );


            passDiv.appendChild(
                toggle
            );


            details.appendChild(
                userDiv
            );


            details.appendChild(
                passDiv
            );


            card.appendChild(
                details
            );



            /* =================================================
               EXTRA FIELDS
            ================================================= */

            const extras =
                document
                    .createElement('div');


            extras.className =
                'details-grid';


            extras.style =
                `
                color:#666;
                border-top:1px dashed #eee;
                padding-top:8px;
                `;


            const extraFields = [

                ['E1', item.e1],

                ['E2', item.e2],

                ['E3', item.e3],

                ['E4', item.e4],

                ['E5', item.e5],

                ['E6', item.e6]

            ];


            extraFields.forEach(
                ([label, value]) => {


                    const div =
                        document
                            .createElement('div');


                    const strong =
                        document
                            .createElement('strong');


                    strong.textContent =
                        label + ':';


                    div.appendChild(
                        strong
                    );


                    div.appendChild(
                        document
                            .createTextNode(
                                ' ' +
                                (value || '-')
                            )
                    );


                    extras.appendChild(
                        div
                    );

                }
            );


            card.appendChild(
                extras
            );



            /* =================================================
               IMAGE BUTTON
            ================================================= */

            if (
                item.image &&
                item.image.trim()
            ) {


                const imageButton =
                    document
                        .createElement('button');


                imageButton.className =
                    'btn btn-image';


                imageButton.textContent =
                    '🖼️ Show Image';


                imageButton.onclick =
                    () => {

                        window.showImage(
                            item.image
                        );

                    };


                card.appendChild(
                    imageButton
                );

            }



            /* =================================================
               EDIT BUTTON
            ================================================= */

            const editButton =
                document
                    .createElement('button');


            editButton.className =
                'btn btn-warning';


            editButton.textContent =
                'Edit';


            editButton.onclick =
                () => {

                    window.openEditModal(
                        id
                    );

                };


            card.appendChild(
                editButton
            );



            /* =================================================
               DELETE BUTTON
            ================================================= */

            const deleteButton =
                document
                    .createElement('button');


            deleteButton.className =
                'btn btn-danger';


            deleteButton.textContent =
                'Delete';


            deleteButton.onclick =
                () => {

                    window.deleteItem(
                        id
                    );

                };


            card.appendChild(
                deleteButton
            );


            list.appendChild(
                card
            );

        }



        /* =================================================
           SEARCH INFO
        ================================================= */

        document
            .getElementById('searchInfo')
            .textContent =
                search
                    ? `${count} result(s) found`
                    : `${count} stored entr${count === 1 ? 'y' : 'ies'}`;


        if (
            count === 0 &&
            search
        ) {

            list.innerHTML = `

                <div
                    style="
                        text-align:center;
                        padding:25px;
                        color:#777;
                    "
                >
                    No matching entries found.
                </div>

            `;

        }

    }



    /* =====================================================
       SHOW IMAGE
    ===================================================== */

    window.showImage =
        (imageName) => {


            if (!imageName) {

                alert(
                    "No image filename saved."
                );

                return;

            }


            imageName =
                imageName.trim();


            /*
                IMPORTANT:

                If Firebase contains:

                image1.jpg

                browser loads:

                ./image1.jpg


                If Firebase contains:

                images/image1.jpg

                browser loads:

                ./images/image1.jpg
            */

            const imagePath =
                './' + imageName;


            const image =
                document
                    .getElementById('fullImage');


            image.src =
                imagePath;


            image.onerror =
                () => {

                    alert(
                        "Image not found:\n\n" +
                        imagePath +
                        "\n\n" +
                        "Make sure the image exists in your repository."
                    );

                    window.closeImageModal();

                };


            image.onload =
                () => {

                    document
                        .getElementById('imageModal')
                        .classList
                        .remove('hidden');

                };

        };



    /* =====================================================
       CLOSE IMAGE
    ===================================================== */

    window.closeImageModal =
        () => {


            document
                .getElementById('imageModal')
                .classList
                .add('hidden');


            document
                .getElementById('fullImage')
                .src = '';

        };



    /* =====================================================
       EDIT MODAL
    ===================================================== */

    window.openEditModal =
        (id) => {


            const d =
                allData[id];


            if (!d) {

                return;

            }


            document
                .getElementById('editId')
                .value = id;


            document
                .getElementById('editName')
                .value =
                    d.name || '';


            document
                .getElementById('editUser')
                .value =
                    d.user || '';


            document
                .getElementById('editPass')
                .value =
                    d.pass || '';


            document
                .getElementById('editImage')
                .value =
                    d.image || '';


            document
                .getElementById('editE1')
                .value =
                    d.e1 || '';


            document
                .getElementById('editE2')
                .value =
                    d.e2 || '';


            document
                .getElementById('editE3')
                .value =
                    d.e3 || '';


            document
                .getElementById('editE4')
                .value =
                    d.e4 || '';


            document
                .getElementById('editE5')
                .value =
                    d.e5 || '';


            document
                .getElementById('editE6')
                .value =
                    d.e6 || '';


            document
